<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Race Program — PaddleSport Gauteng</title>
<link rel="stylesheet" href="style.css">
<style>
  .race-block{border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:10px;background:#fff;}
  .race-block.published{border-left:4px solid var(--green);}
  .race-block.unpublished{border-left:4px solid var(--gray);}
  .race-block h4{margin:0 0 8px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;font-size:15px}
  .lane-row{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:13px;}
  .lane-row:last-child{border-bottom:none}
  .lane-row .lanenum{width:52px;font-weight:700;color:var(--gray);flex-shrink:0}
  .lane-row.lane-header{padding:4px 0;border-bottom:2px solid var(--line)}
  .lane-row.lane-header .lanenum,.lane-row.lane-header td{font-size:11px;font-weight:700;color:var(--gray);letter-spacing:0.06em}
  .lane-row select{font-size:12px;padding:4px;border-radius:5px;border:1px solid var(--line)}
  .lane-row button{font-size:12px;padding:5px 8px;flex-shrink:0}
  .paddler-table{flex:1;min-width:0;border-collapse:collapse;table-layout:fixed;width:420px;font-family:Arial,sans-serif;}
  .paddler-table td{padding:1px 8px 1px 0;font-size:12px;overflow:hidden;text-transform:uppercase;letter-spacing:0.02em;}
  .paddler-table td.pname{font-weight:700;word-break:break-word;white-space:normal;width:170px;}
  .paddler-table td.pmeta{color:var(--gray);white-space:nowrap;}
  .paddler-table td.cage{width:55px;}
  .paddler-table td.cclub{width:50px;}
  .paddler-table td.csex{width:22px;}
  .paddler-table td.cunion{width:42px;}
  .paddler-table td.cpsa{width:50px;}
  .lane-actions{display:flex;gap:4px;align-items:center;flex-shrink:0}
  .time-input{width:110px !important;display:inline-block}
  .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:10px}
  .toolbar label{font-size:12px;color:var(--gray);display:block;margin-bottom:4px}
  .toolbar input{padding:8px;border-radius:6px;border:1px solid var(--line)}
  .events-table td, .events-table th{font-size:13px}
  .merge-bar{position:sticky;top:0;background:#EAF1FA;border:1px solid #B8D0EA;border-radius:8px;padding:10px;margin-bottom:14px;font-size:13px;z-index:5}
</style>
</head>
<body>
<header class="topbar">
  <a href="/" class="title">PaddleSport Gauteng</a>
  <nav><a href="/admin.html">Race Office</a><a href="/race-sort.html">Race Sort</a><a href="/draw.html">Draw</a><a href="/program.html">Race Program</a><a href="/tower.html">Tower</a><a href="/weigh.html">Weigh</a><a href="/results.html">Results</a><a href="/live.html" id="liveNavLink">Live</a></nav>
  <div id="meetBar"></div>
</header>
<main>
  <h1>Race Program</h1>
  <div class="flag" id="meetWarning" style="display:none">No meet selected — pick or create one at the top-right first.</div>
  <div id="progressStrip"></div>
  <div class="card">
    <h2 style="margin-top:0">Start times</h2>
        <div id="startTimesRows"></div>
    <div style="margin-top:8px">
      <label style="font-size:13px;color:var(--gray)"><input type="checkbox" id="overwriteTimes"> overwrite existing times</label>
    </div>
    <div id="startTimesResult"></div>
  </div>

  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px">
      <h2 style="margin:0">Race Program</h2>
      <div class="btn-row">
        <button onclick="autoSequence()" title="Heats first, then semis, then finals">Auto-sequence</button>
        <button onclick="toggleGapForm()">Add gap</button>
        <div class="menu-wrap">
          <button class="navy" onclick="toggleMenu('exportMenu')">Export</button>
          <div class="menu" id="exportMenu">
            <button onclick="downloadSchedule()">Planning sheet (PDF)</button>
            <button onclick="downloadPdf()">Programme (PDF)</button>
            <button onclick="downloadDraws()">Draws (Excel)</button>
          </div>
        </div>
        <button class="green" onclick="finalise()">Finalise to Tower</button>
        <button onclick="unfinalise()">Unfinalise</button>
      </div>
    </div>
    <div id="gapForm" class="flag" style="display:none;background:#FFFBF2;border-color:#F3C98B;color:#8A5A12">
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
        <input type="text" id="newBreakLabel" placeholder="Label, e.g. Lunch or Jetty move" style="flex:1;min-width:200px;padding:7px">
        <input type="number" id="newBreakDuration" placeholder="Minutes" min="1" style="width:90px;padding:7px">
        <select id="newBreakAfter" style="min-width:180px;padding:7px"><option value="0">at start of day</option></select>
        <button class="green" onclick="addBreak()">Add</button>
        <button onclick="toggleGapForm()">Cancel</button>
      </div>
    </div>
    <div style="display:flex;gap:6px;margin-bottom:8px">
      <button class="sm" onclick="expandAll()">Expand all</button>
      <button class="sm" onclick="collapseAll()">Collapse all</button>
    </div>
    <div id="mergeBar"></div>
    <div id="raceList">Loading…</div>
  </div>

  <div id="advanceTable" style="display:none"></div>
</main>
<script src="common.js"></script>
<script>
let allEntries = [];
let allRaces = [];
let meetNumDays = 1;

let allEvents = [];


// Lightweight — just populates allEvents for the round-advancement table
// below. Full drawing (Generate/Confirm/Change/slide assignment) lives
// on its own page now: /draw.html.
async function loadEvents(){
  const meetId = getMeetId();
  if(!meetId) return;
  try {
      const res = await fetch(`/api/programme/events?meetId=${encodeURIComponent(meetId)}`);
    if(!res.ok) throw new Error(`Server returned ${res.status}`);
    allEvents = await res.json();
  } catch (err) {
    console.error(err);
  }
}

async function loadAdvanceTable(){
  const el = document.getElementById('advanceTable');
  const drawnMultiRound = allEvents.filter(e => e.hasRaces && e.format.runnable && e.format.rounds.length > 1);
  if(drawnMultiRound.length === 0){ el.innerHTML = '<p style="color:var(--gray)">No multi-round events drawn yet.</p>'; return; }

  const panels = await Promise.all(drawnMultiRound.map(async (ev) => {
    try {
      const data = await (await fetch(`/api/programme/events/${ev.id}/next-round`)).json();

      // Automatic case (the normal path — ICF Plan A-G): semis/finals are
      // created the instant a round finishes, no action needed here. Just
      // show where things stand.
      if(!ev.format.unsupported){
        if(!data.available) return null; // e.g. "already fully advanced" or "waiting" — nothing to show
        return `<div class="race-block"><h4><span>${ev.label} — waiting</span></h4>
          <p style="color:var(--gray);font-size:13px">${data.reason}</p></div>`;
      }

      // Fallback case: field bigger than ICF's published tables (>72
      // boats / >8 heats) — no automatic rule to apply, so review/select
      // qualifiers by hand.
      if(!data.available) return null;
      const rows = data.candidates.map(c => `
        <label class="lane-row" style="cursor:pointer">
          <input type="checkbox" class="advance-check" value="${c.entryId}" ${c.suggested?'checked':''}>
          <span style="flex:1">${c.names.join(' / ')} <small style="color:var(--gray)">Heat ${c.heatNumber} · #${c.position} · ${fmtMs(c.finishTimeMs)}</small></span>
        </label>`).join('');
      return `<div class="race-block">
        <h4><span>${ev.label} — ${data.currentPhase.toUpperCase()} finished, ready for ${data.nextPhase.toUpperCase()} (manual — field exceeds ICF's published tables)</span></h4>
        ${rows || '<p style="color:var(--gray);font-size:13px">No eligible finishers found.</p>'}
        <div style="margin-top:8px"><button class="primary" onclick="createNextRound('${ev.id}', '${data.nextPhase}', this)">Create ${data.nextPhase}</button></div>
      </div>`;
    } catch (err) { return null; }
  }));

  const html = panels.filter(Boolean).join('');
  el.innerHTML = html || '<p style="color:var(--gray)">All drawn events are either done or auto-advanced already — nothing waiting.</p>';
}

function fmtMs(ms){
  const cs = Math.floor(ms/10)%100;
  const totalSec = Math.floor(ms/1000);
  const sec = totalSec%60;
  const min = Math.floor(totalSec/60);
  const pad=(n,l=2)=>String(n).padStart(l,'0');
  return `${pad(min)}:${pad(sec)}.${pad(cs)}`;
}

async function createNextRound(eventId, phase, btn){
  const block = btn.closest('.race-block');
  const ids = [...block.querySelectorAll('.advance-check:checked')].map(c => c.value);
  if(ids.length === 0){ alert('Tick at least one qualifier.'); return; }
  if(ids.length > 9){ alert('That\'s more than 9 boats — untick some, or create this round in two batches.'); return; }
  const res = await fetch(`/api/programme/events/${eventId}/create-next-round`, {
    method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({phase, entryIds: ids})
  });
  const data = await res.json();
  if(!res.ok){ alert(data.error); return; }
  await loadAdvanceTable();
  await loadRaceList();
}

function downloadSchedule(){
  const meetId = getMeetId();
  if(!meetId){ alert('Pick a meet first.'); return; }
  window.open(`/api/export/schedule.pdf?meetId=${encodeURIComponent(meetId)}&_=${Date.now()}`, '_blank');
}

function downloadPdf(){
  const meetId = getMeetId();
  // Cache-bust with a timestamp so a re-download after changing times/draws
  // always fetches fresh, never a stale cached copy.
  window.open(`/api/export/programme.pdf?meetId=${encodeURIComponent(meetId)}&_=${Date.now()}`, '_blank');
}

function downloadDraws(){
  const meetId = getMeetId();
  window.open(`/api/export/draws.xlsx?meetId=${encodeURIComponent(meetId)}&_=${Date.now()}`, '_blank');
}

async function autoSequence(){
  const meetId = getMeetId();
  if(!meetId){ alert('Pick a meet first.'); return; }
  const ok = await customConfirm('Re-sequence every not-yet-started race? Heats from multi-round events go first, straight finals get mixed in. You can still fine-tune with the position buttons after.');
  if(!ok) return;
  const res = await fetch('/api/programme/auto-sequence', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({meetId}) });
  const data = await res.json();
  if(!res.ok){ alert(data.error); return; }
  alert(`${data.reordered} race(s) re-sequenced and times updated to match.`);
  await loadRaceList();
}

async function moveRaceTo(raceId, target){
  const meetId = getMeetId();
  const races = await (await fetch(`/api/programme/races?meetId=${encodeURIComponent(meetId)}`)).json();
  const pending = races.filter(r => r.status === 'pending');
  const idx = pending.findIndex(r => r.id === raceId);
  if(idx === -1) return;
  const [item] = pending.splice(idx, 1);

  let insertAt;
  if(target === 'top') insertAt = 0;
  else if(target === 'bottom') insertAt = pending.length;
  else if(target === 'up') insertAt = Math.max(0, idx - 1);
  else if(target === 'down') insertAt = Math.min(pending.length, idx + 1);
  else {
    insertAt = Math.max(0, Math.min(pending.length, Number(target) - 1));
    if(isNaN(insertAt)){ alert('Enter a position number.'); return; }
  }
  pending.splice(insertAt, 0, item);

  const orderedRaceIds = pending.map(r => r.id);
  const res = await fetch('/api/programme/reorder-races', {
    method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({meetId, orderedRaceIds})
  });
  const data = await res.json();
  if(!res.ok){ alert(data.error); return; }
  await loadRaceList();
}

function loadStartTimesRows(){
  const el = document.getElementById('startTimesRows');
  if(!el) return;
  const days = meetNumDays || 1;
  let html = '';
  for(let d = 1; d <= days; d++){
    const label = days > 1 ? `Day ${d}` : 'All races';
    html += `<div style="display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap">
      <span style="font-size:13px;font-weight:600;min-width:50px">${label}</span>
      <div><label style="font-size:12px;color:var(--gray)">First start</label>
        <input type="text" id="firstTime-${d}" placeholder="08:00" value="08:00" style="width:80px;padding:6px;margin-left:6px"></div>
      <div><label style="font-size:12px;color:var(--gray)">Min between races</label>
        <input type="number" id="intervalMin-${d}" value="4" style="width:60px;padding:6px;margin-left:6px"></div>
      <button class="primary" onclick="generateStartTimes(${d})">Set ${days > 1 ? 'Day '+d+' ' : ''}times</button>
    </div>`;
  }
  el.innerHTML = html;
}

async function generateStartTimes(day){
  const meetId = getMeetId();
  if(!meetId){ alert('Pick a meet first.'); return; }
  const d = day || 1;
  const firstTime = document.getElementById(`firstTime-${d}`).value;
  const intervalMinutes = document.getElementById(`intervalMin-${d}`).value;
  const overwrite = document.getElementById('overwriteTimes').checked;
  const res = await fetch('/api/programme/generate-start-times', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({meetId, firstTime, intervalMinutes, overwrite, day: d})
  });
  const data = await res.json();
  const el = document.getElementById('startTimesResult');
  if(!res.ok){ el.innerHTML = `<div class="flag">${data.error}</div>`; return; }
  el.innerHTML = `<div class="flag" style="background:#E4F5EC;border-color:#9ED8B8;color:#1E8E5A">${meetNumDays > 1 ? 'Day '+d+': ' : ''}${data.updated} race times set.</div>`;
  loadRaceList();
}

function toggleMenu(id){
  const m = document.getElementById(id);
  const open = m.classList.toggle('open');
  if(open){ setTimeout(()=>document.addEventListener('click', function h(e){ if(!m.contains(e.target)){ m.classList.remove('open'); document.removeEventListener('click', h); } }), 0); }
}
function toggleGapForm(){
  const f = document.getElementById('gapForm');
  f.style.display = f.style.display === 'none' ? 'block' : 'none';
  if(f.style.display === 'block') document.getElementById('newBreakLabel').focus();
}

async function unfinalise(){
  const meetId = getMeetId();
  if(!meetId){ alert('Pick a meet first.'); return; }
  const ok = await customConfirm('Unfinalise? This removes all pending races from the Tower so you can reorder them. Races already started or finished are not affected.');
  if(!ok) return;
  const res = await fetch('/api/programme/unfinalise', {
    method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({meetId})
  });
  const data = await res.json();
  if(!res.ok){ alert(data.error); return; }
  alert(`Done — ${data.unpublished} pending races removed from Tower. Make your changes then Finalise again.`);
  loadRaceList();
}

async function finalise(){
  const meetId = getMeetId();
  if(!meetId){ alert('Pick a meet first.'); return; }
  // Multi-day check: warn if any race has no day assigned
  if(meetNumDays > 1){
    const unassigned = (allRaces||[]).filter(r => !r.day && r.status==='pending');
    if(unassigned.length){
      alert(`This is a ${meetNumDays}-day meet but ${unassigned.length} race(s) have no day set — they will all default to Day 1.\n\nSet the day on each race (dropdown on the race title row) before finalising.`);
      return;
    }
  }
  if(!(await customConfirm('Send every drawn race to the Tower? You can still edit anything not yet started.'))) return;
  const res = await fetch('/api/programme/finalise', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({meetId}) });
  const data = await res.json();
  if(!res.ok){ alert(data.error); return; }
  if(data.totalDrawn === 0){
    alert('Nothing to publish — no races have been drawn yet. Go to Race Sort / Race Program section 2 first.');
  } else if(data.published === 0){
    alert(`No NEW races to publish — all ${data.alreadyPublished} already-drawn race(s) are already on the Tower. If you've drawn more since, they've now been included too (still 0 means they were already there, or you haven't drawn any new ones since last time).`);
  } else {
    alert(`${data.published} new race(s) published to the Tower (${data.alreadyPublished} were already there from before).`);
  }
  loadRaceList();
}

async function loadRaceList(keepOpen){
  // keepOpen: Set of raceIds that should stay expanded after re-render.
  // If not passed, snapshot which blocks are currently open so a silent
  // refresh (e.g. auto-poll) doesn't collapse anything the user opened.
  if(!keepOpen){
    keepOpen = new Set();
    document.querySelectorAll('.race-lanes').forEach(el => {
      if(el.style.display !== 'none'){
        const id = el.id.replace('lanes-','');
        keepOpen.add(id);
      }
    });
  }

  const meetId = getMeetId();
  const el = document.getElementById('raceList');
  const mergeBarEl = document.getElementById('mergeBar');
  if(!meetId){ el.innerHTML=''; return; }
  try {
    const races = await (await fetch(`/api/programme/schedule?meetId=${encodeURIComponent(meetId)}`)).json();
    allEntries = await (await fetch(`/api/entries?meetId=${encodeURIComponent(meetId)}`)).json();
    allRaces = races.filter(r => r.type !== 'break');
    // load meetNumDays for the day selector on each race
    try {
      const meets = await (await fetch('/api/meets')).json();
      const meet = meets.find(m => m.id === meetId);
      meetNumDays = (meet && meet.numDays) || 1;
    } catch(e){ meetNumDays = 1; }
    loadStartTimesRows();

    const mergeableByEvent = {};
    races.filter(r => r.phase==='heat' && r.status==='pending').forEach(r => {
      const key = r.eventId;
      (mergeableByEvent[key] = mergeableByEvent[key] || { label: r.combinedLabel || r.event.label, races: [] }).races.push(r);
    });
    const eventsWithMultipleHeats = Object.values(mergeableByEvent).filter(g => g.races.length > 1);
    if(eventsWithMultipleHeats.length === 0){
      mergeBarEl.innerHTML = '';
    } else {
      mergeBarEl.innerHTML = `
      <div class="merge-bar">
        <div style="cursor:pointer" onclick="document.getElementById('mergeBarBody').style.display = document.getElementById('mergeBarBody').style.display==='none' ? 'block' : 'none'">
          <b>Merge under-full heats</b> <span style="color:var(--gray);font-weight:400">(optional — click to open)</span>
        </div>
        <div id="mergeBarBody" style="display:none;margin-top:10px">
          <p style="color:var(--gray);margin:0 0 8px;font-size:12px">Tick two or more heats from the same event, then merge.</p>
          ${Object.values(mergeableByEvent).filter(g => g.races.length > 1).map(g => `
            <div style="margin-bottom:8px">
              <div style="font-weight:700;font-size:13px;margin-bottom:4px">${g.label}</div>
              ${g.races.map(r => `<label style="margin-right:14px;display:inline-block;margin-bottom:4px"><input type="checkbox" class="merge-check" value="${r.id}"> R${r.raceNumber} Heat ${r.heatNumber}</label>`).join('')}
            </div>`).join('')}
          <button onclick="mergeSelected()">Merge selected</button>
        </div>
      </div>`;
    }

    if(races.length===0){ el.innerHTML = '<p style="color:var(--gray)">No races generated yet.</p>'; } else {
      // Group by day with separator headers, continuous race numbering
      const numDays = meetNumDays || 1;
      let html = '';
      if(numDays > 1){
        // Sort by day then position (sortKey for breaks, raceNumber for races)
        const sorted = [...races].sort((a,b) => {
          const da = a.day || 1, db = b.day || 1;
          if(da !== db) return da - db;
          const sa = a.type === 'break' ? (a.sortKey||0) : (a.raceNumber||0);
          const sb = b.type === 'break' ? (b.sortKey||0) : (b.raceNumber||0);
          return sa - sb;
        });
        let currentDay = null;
        sorted.forEach((r, i) => {
          const rDay = r.day || 1;
          const nextDay = sorted[i+1] ? (sorted[i+1].day || 1) : null;
          if(rDay !== currentDay){
            currentDay = rDay;
            const dayRaces = sorted.filter(x => (x.day||1) === rDay);
            const times = dayRaces.map(x => x.scheduledLabel).filter(Boolean).sort();
            const span = times.length ? `${times[0]} – ${times[times.length-1]}` : 'no times set';
            const summary = `${dayRaces.length} race${dayRaces.length===1?'':'s'} · ${span}`;
            html += `<div style="background:var(--navy);color:#fff;font-weight:700;font-size:14px;padding:8px 14px;border-radius:6px;margin:12px 0 6px;display:flex;justify-content:space-between;align-items:center"><span>DAY ${currentDay}</span><span style="font-weight:500;font-size:12px;opacity:.85">${summary}</span></div>`;
          }
          html += raceBlockHtml(r);
          // End of day marker when day changes or at the very end
          if(nextDay !== rDay){
            html += `<div style="border:2px dashed var(--line);border-radius:6px;padding:8px 14px;text-align:center;font-size:13px;font-weight:700;color:var(--gray);margin:6px 0 12px;letter-spacing:0.05em">— END OF DAY ${rDay} —</div>`;
          }
        });
      } else {
        // Single day — already sorted by schedule order from server
        html = races.map(r => raceBlockHtml(r)).join('');
      }
      el.innerHTML = html;
      // Restore any blocks that were open before the re-render
      keepOpen.forEach(raceId => {
        const lanesEl = document.getElementById(`lanes-${raceId}`);
        const iconEl = document.getElementById(`toggle-${raceId}`);
        if(lanesEl){ lanesEl.style.display = 'block'; }
        if(iconEl){ iconEl.textContent = '▼'; }
      });
    }
    const afterSel = document.getElementById('newBreakAfter');
    afterSel.innerHTML = '<option value="" data-day="1">— start of programme —</option>' + races.filter(r=>r.type!=='break').map((r) => {
      const label = `After R${r.raceNumber}: ${r.combinedLabel || (r.event ? r.event.label : '')} (Day ${r.day||1})`;
      return `<option value="${r.id}" data-day="${r.day||1}">${label}</option>`;
    }).join('');
  } catch (err) {
    console.error(err);
    el.innerHTML = `<div class="flag">Couldn't load race list: ${err.message}</div>`;
  }
}

function phaseLabel(race){
  const map = { heat: `HEAT ${race.heatNumber}`, semi: `SEMI ${race.heatNumber}`, final: 'FINAL A', finalB: 'FINAL B', finalC: 'FINAL C' };
  return map[race.phase] || race.phase.toUpperCase();
}

// Once a race finishes it's "provisional" until the office marks it
// official (weigh-ins done, no more changes expected). A late DQ
// automatically reverts an already-official race back to provisional —
// see races.js.
function resultsConfirmHtml(race){
  if(race.status !== 'finished') return '';
  const confirmPill = race.resultsConfirmed
    ? `<span class="pill ok">Official</span> <button onclick="toggleConfirm('${race.id}', false)">Revert to provisional</button>`
    : `<span class="pill warn">Provisional</span> <button class="green" onclick="toggleConfirm('${race.id}', true)">Mark official</button>`;
  return `${confirmPill} <button class="red" onclick="reopenRace('${race.id}')" title="Went to 'finished' too early? Put it back to running.">Reopen race</button>`;
}
async function toggleConfirm(raceId, confirm){
  const res = await fetch(`/api/races/${raceId}/${confirm?'confirm-results':'unconfirm-results'}`, {method:'POST'});
  const data = await res.json();
  if(!res.ok){ alert(data.error); return; }
  loadRaceList();
}
async function reopenRace(raceId){
  const ok = await customConfirm('Reopen this race? Puts it back to "running" on the Tower so you can finish assigning lanes/crossings — nothing already recorded is lost.');
  if(!ok) return;
  const res = await fetch(`/api/races/${raceId}/reopen`, { method:'POST' });
  const data = await res.json();
  if(!res.ok){ alert(data.error); return; }
  alert('Reopened — it\'s back on the Tower now.');
  loadRaceList();
}

function massRaceBlockHtml(race){
  const bibs = Object.entries(race.laneEntries).sort((a,b)=>Number(a[0])-Number(b[0]));
  const locked = race.status !== 'pending';
  const statusPill = race.status==='finished' ? 'ok' : race.status==='running' ? 'warn' : 'ok';
  const publishedPill = race.published ? `<span class="pill ok">Published</span>` : `<span class="pill warn">Draft</span>`;

  const rows = bibs.map(([bib, info]) => {
    if(!info) return '';
    const laps = info.laps || [];
    const done = laps.length >= race.totalLaps;
    const lapStr = laps.length ? laps.map(l => fmtMs(l.timeMs)).join(', ') : '—';
    const gLetter = info.gender ? (info.gender.toLowerCase().startsWith('f') ? 'F' : info.gender.toLowerCase().startsWith('m') ? 'M' : info.gender) : '';
    return `<div class="lane-row">
      <div class="lanenum">Slide ${bib}</div>
      <table class="paddler-table"><tr>
        <td class="pname">${info.names[0]||''}</td>
        <td class="pmeta cage">${info.ageCategory||''}</td>
        <td class="pmeta cclub">${info.clubCode||''}</td>
        <td class="pmeta csex">${gLetter}</td>
        <td class="pmeta cunion">${info.union||''}</td>
        <td class="pmeta cpsa">${(info.psaIds||[])[0]||''}</td>
        <td class="pmeta" style="color:var(--gray);font-size:11px">${laps.length}/${race.totalLaps} laps ${done?'✓':''} ${lapStr}</td>
      </tr></table>
      ${!locked ? `<div class="lane-actions">
        <input type="number" placeholder="new #" class="sm w-num" id="renumber-${race.id}-${bib}">
        <button class="sm" onclick="renumberSlide('${race.id}', ${bib})">Renumber</button>
        <button class="sm red" onclick="scratchLane('${race.id}', ${bib})">Scratch</button>
      </div>` : ''}
    </div>`;
  }).join('');

  return `<div class="race-block ${race.published?'published':'unpublished'}" id="raceblock-${race.id}">
    <h4 onclick="toggleRaceBlock('${race.id}')" style="cursor:pointer">
      <span>
        <span style="color:var(--gray);font-size:13px;margin-right:6px" id="toggle-${race.id}">▶</span>
        Race ${race.raceNumber}: ${race.combinedEventIds && race.combinedEventIds.length>1 ? `<b>${race.combinedLabel}</b>` : race.event.label} — ${phaseLabel(race)}
        ${locked ? `(mass start, ${race.totalLaps} laps)` : `(mass start, <span onclick="event.stopPropagation()"><input type="number" value="${race.totalLaps}" class="sm" style="width:50px" onchange="editLaps('${race.id}', this.value)"></span> laps)`}
        ${race.overridden ? ' <span class="pill bad">OVERRIDDEN</span>' : ''}
        <span class="pill ${statusPill}">${race.status}</span> ${publishedPill} ${resultsConfirmHtml(race)}
        <small style="color:var(--gray);margin-left:8px">${race.scheduledLabel||''}</small>
      </span>
      <span onclick="event.stopPropagation()">
        ${meetNumDays > 1 ? `<select class="sm" onchange="setRaceDay('${race.id}',this.value)">
          ${Array.from({length:meetNumDays},(_,i)=>i+1).map(d=>`<option value="${d}" ${(race.day||1)===d?'selected':''}>Day ${d}</option>`).join('')}
        </select>` : ''}
        ${locked ? '' : `
          <button class="sm" onclick="moveRaceTo('${race.id}','up')" title="Move up one">Up</button>
          <button class="sm" onclick="moveRaceTo('${race.id}','down')" title="Move down one">Down</button>
          <span style="display:inline-flex;align-items:center;gap:3px">
            <input type="number" id="movePos-${race.id}" placeholder="Race #" class="sm w-num" onkeydown="if(event.key==='Enter'){moveRaceTo('${race.id}', this.value);}">
            <button class="sm" onclick="moveRaceTo('${race.id}', document.getElementById('movePos-${race.id}').value)">Go</button>
          </span>
          <input type="text" class="time-input" placeholder="Start time e.g. 08:00" value="${race.scheduledLabel||''}" onchange="setSchedule('${race.id}', this.value)">
          <span style="display:inline-flex;align-items:center;gap:3px">
            <input type="number" min="1" value="${race.gapAfterMinutes||''}" placeholder="std gap" class="sm w-num" onchange="setGap('${race.id}', this.value)">
            <small style="color:var(--gray);white-space:nowrap">min before next</small>
          </span>
          <button class="sm red" onclick="deleteRace('${race.id}')">Change grouping (undo draw)</button>
        `}
      </span>
    </h4>
    <div class="race-lanes" id="lanes-${race.id}" style="display:none">
      ${rows}
    </div>
  </div>`;
}

async function renumberSlide(raceId, oldSlide){
  const input = document.getElementById(`renumber-${raceId}-${oldSlide}`);
  const newSlide = input.value;
  if(!newSlide){ alert('Enter the new slide number.'); return; }
  const res = await fetch(`/api/races/${raceId}/rename-slide`, {
    method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({oldSlide, newSlide: Number(newSlide)})
  });
  const data = await res.json();
  if(!res.ok){ alert(data.error); return; }
  loadRaceList(new Set([raceId]));
}

async function editLaps(raceId, totalLaps){
  const res = await fetch(`/api/races/${raceId}/laps`, {
    method:'PATCH', headers:{'Content-Type':'application/json'}, body: JSON.stringify({totalLaps: Number(totalLaps)})
  });
  const data = await res.json();
  if(!res.ok){ alert(data.error); loadRaceList(); return; }
  loadRaceList();
}



// A "space keeper" — jetty move, lunch, tea, anything that needs its own
// block of time but isn't a race. Same move/delete controls as a race
// block, styled distinctly (dashed border, amber) so it's never mistaken
// for an actual race at a glance.
function breakBlockHtml(brk){
  return `<div class="race-block" style="border-style:dashed;border-color:#F3C98B;background:#FFFBF2">
    <h4>
      <span style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
        <span style="color:#8A5A12">⏸</span>
        <input type="text" value="${brk.label.replace(/"/g,'&quot;')}" class="sm" style="font-weight:700;width:220px" onchange="editBreakLabel('${brk.id}', this.value)">
        <span class="pill warn">BREAK</span>
      </span>
      <span>
        <button class="sm" onclick="moveBreakTo('${brk.id}','up')" title="Move up one">Up</button>
        <button class="sm" onclick="moveBreakTo('${brk.id}','down')" title="Move down one">Down</button>
        <span style="display:inline-flex;align-items:center;gap:3px">
          <input type="number" id="breakPos-${brk.id}" placeholder="Race #" title="Type the position this should become, then press Enter or click →" class="sm w-num" onkeydown="if(event.key==='Enter'){moveBreakTo('${brk.id}', this.value);}">
          <button class="sm" onclick="moveBreakTo('${brk.id}', document.getElementById('breakPos-${brk.id}').value)" title="Move to this position — the rest shift and renumber to match">Go</button>
        </span>
        <span style="display:inline-flex;align-items:center;gap:4px;padding:5px 8px;border:1px solid var(--line);border-radius:5px;background:#fff;font-size:13px;color:var(--gray)">${brk.scheduledLabel || 'TBC'}</span>
        <span style="display:inline-flex;align-items:center;gap:3px">
          <input type="number" min="1" value="${brk.durationMinutes||''}" title="How long this break takes — everything after it shifts to match" class="sm w-num" onchange="editBreakDuration('${brk.id}', this.value)">
          <small style="color:var(--gray);white-space:nowrap">min</small>
        </span>
        <button class="sm red" onclick="deleteBreak('${brk.id}')">Delete</button>
      </span>
    </h4>
  </div>`;
}

function raceBlockHtml(race){
  if(race.type === 'break') return breakBlockHtml(race);
  if(race.isMassStart) return massRaceBlockHtml(race);
  const lanes = Object.entries(race.laneEntries).sort((a,b)=>Number(a[0])-Number(b[0]));
  const locked = race.status !== 'pending';
  // For a COMBINED race, race.eventId is only the PRIMARY event — the
  // other member categories live in race.combinedEventIds. Loading
  // options from the primary alone meant athletes from the other
  // categories had no matching <option>, so the <select> silently fell
  // back to "— empty —" even though they WERE correctly assigned to that
  // lane. That's why this screen disagreed with the Excel draw sheet
  // (which prints names directly, no dropdown). Load every member
  // event's entries so each occupant always has an option to select.
  const eventIdsForOptions = (race.combinedEventIds && race.combinedEventIds.length > 1)
    ? race.combinedEventIds
    : [race.eventId];
  const entriesForEvent = allEntries.filter(e => eventIdsForOptions.includes(e.eventId) && e.status === 'active');
  const placedIds = new Set(Object.values(race.laneEntries).filter(Boolean).map(i=>i.entryId));
  const options = (currentId) => entriesForEvent
    .filter(e => e.id===currentId || !placedIds.has(e.id))
    .map(e => `<option value="${e.id}" ${e.id===currentId?'selected':''}>${e.names.join(' / ')}</option>`).join('');

  const laneRows = lanes.map(([lane, info]) => {
    function genderLetter(g){ return g ? (g.toLowerCase().startsWith('f') ? 'F' : g.toLowerCase().startsWith('m') ? 'M' : g) : ''; }

    function paddlerRow(name, age, club, sex, union, psaId) {
      return `<tr>
        <td class="pname">${name}</td>
        <td class="pmeta cage">${age}</td>
        <td class="pmeta cclub">${club}</td>
        <td class="pmeta csex">${genderLetter(sex)}</td>
        <td class="pmeta cunion">${union}</td>
        <td class="pmeta cpsa">${psaId||''}</td>
      </tr>`;
    }

    const paddlerRows = info
      ? (info.names.length > 1
          ? paddlerRow(info.names[0]||'', info.ageCategory||'', info.clubCode||'', info.gender||'', info.union||'', (info.psaIds||[])[0]||'')
            + paddlerRow(info.names[1]||'', info.ageCategory||'', info.clubCode||'', info.gender||'', info.union||'', (info.psaIds||[])[1]||'')
          : paddlerRow(info.names[0]||'', info.ageCategory||'', info.clubCode||'', info.gender||'', info.union||'', (info.psaIds||[])[0]||''))
      : `<tr><td colspan="6" style="color:var(--gray)">(empty)</td></tr>`;

    const paddlerTable = `<table class="paddler-table">${paddlerRows}</table>`;

    if(locked){
      return `<div class="lane-row">
        <div class="lanenum">Lane ${lane}</div>
        ${paddlerTable}
      </div>`;
    }

    const otherLanes = lanes.filter(([l]) => l !== lane);
    const swapOptions = otherLanes.map(([l, i]) => `<option value="${l}">Lane ${l}${i ? ' — '+i.names[0] : ' (empty)'}</option>`).join('');
    const otherRaces = allRaces.filter(r => r.id !== race.id && r.status === 'pending');
    const moveOptions = otherRaces.map(r => `<option value="${r.id}">Race ${r.raceNumber}: ${r.event ? r.event.label : ''} — ${phaseLabel(r)}</option>`).join('');

    return `<div class="lane-row">
      <div class="lanenum">Lane ${lane}</div>
      ${paddlerTable}
      <div class="lane-actions">
        <select onchange="if(this.value)swapLanes('${race.id}',${lane},this.value)" style="max-width:120px" title="Swap with another lane">
          <option value="">Swap…</option>
          ${swapOptions}
        </select>
        <select onchange="if(this.value)moveToRace('${race.id}',${lane},'${info ? info.entryId : ''}',this.value)" style="max-width:130px" title="Move to a different race">
          <option value="">Move to…</option>
          ${moveOptions}
        </select>
        ${info ? `<button class="sm red" onclick="scratchLane('${race.id}', ${lane})">Scratch</button>` : ''}
      </div>
    </div>`;
  }).join('');

  const statusPill = race.status==='finished' ? 'ok' : race.status==='running' ? 'warn' : 'ok';
  const publishedPill = race.published ? `<span class="pill ok">Published</span>` : `<span class="pill warn">Draft</span>`;

  return `<div class="race-block ${race.published?'published':'unpublished'}" id="raceblock-${race.id}">
    <h4 onclick="toggleRaceBlock('${race.id}')" style="cursor:pointer">
      <span>
        <span style="color:var(--gray);font-size:13px;margin-right:6px" id="toggle-${race.id}">▶</span>
        Race ${race.raceNumber}: ${race.combinedEventIds && race.combinedEventIds.length>1 ? `<b>${race.combinedLabel}</b>` : race.event.label} — ${phaseLabel(race)}${race.overridden ? ' <span class="pill bad">OVERRIDDEN</span>' : ''}
        <span class="pill ${statusPill}">${race.status}</span> ${publishedPill} ${resultsConfirmHtml(race)}
        <small style="color:var(--gray);margin-left:8px">${race.scheduledLabel||''}</small>
      </span>
      <span onclick="event.stopPropagation()">
        ${meetNumDays > 1 ? `<select class="sm" onchange="setRaceDay('${race.id}',this.value)" title="Which day does this race run on">
          ${Array.from({length:meetNumDays},(_,i)=>i+1).map(d=>`<option value="${d}" ${(race.day||1)===d?'selected':''}>Day ${d}</option>`).join('')}
        </select>` : ''}
        ${locked ? '' : `
          <button class="sm" onclick="moveRaceTo('${race.id}','up')" title="Move up one">Up</button>
          <button class="sm" onclick="moveRaceTo('${race.id}','down')" title="Move down one">Down</button>
          <span style="display:inline-flex;align-items:center;gap:3px">
            <input type="number" id="movePos-${race.id}" placeholder="Race #" title="Type the race number this should become, then press Enter or click →" class="sm w-num" onkeydown="if(event.key==='Enter'){moveRaceTo('${race.id}', this.value);}">
            <button class="sm" onclick="moveRaceTo('${race.id}', document.getElementById('movePos-${race.id}').value)" title="Move to this race number">Go</button>
          </span>
          <input type="text" class="time-input" placeholder="Start time e.g. 08:00" value="${race.scheduledLabel||''}" onchange="setSchedule('${race.id}', this.value)">
          <span style="display:inline-flex;align-items:center;gap:3px">
            <input type="number" min="1" value="${race.gapAfterMinutes||''}" placeholder="std gap" title="Minutes before next race" class="sm w-num" onchange="setGap('${race.id}', this.value)">
            <small style="color:var(--gray);white-space:nowrap">min before next</small>
          </span>
          <button class="sm red" onclick="deleteRace('${race.id}')">Delete race</button>
        `}
      </span>
    </h4>
    <div class="race-lanes" id="lanes-${race.id}" style="display:none">
      <div class="lane-row lane-header">
        <span class="lanenum">LANE</span>
        <table class="paddler-table"><tr>
          <td class="pname">NAME</td>
          <td class="pmeta cage">AGE</td>
          <td class="pmeta cclub">CLUB</td>
          <td class="pmeta csex">M/F</td>
          <td class="pmeta cunion">UNION</td>
          <td class="pmeta cpsa">PSA #</td>
        </tr></table>
      </div>
      ${laneRows}
    </div>
  </div>`;
}

function toggleRaceBlock(raceId){
  const lanes = document.getElementById(`lanes-${raceId}`);
  const icon = document.getElementById(`toggle-${raceId}`);
  if(!lanes) return;
  const isOpen = lanes.style.display !== 'none';
  lanes.style.display = isOpen ? 'none' : 'block';
  if(icon) icon.textContent = isOpen ? '▶' : '▼';
}

function expandAll(){
  document.querySelectorAll('.race-lanes').forEach(el => el.style.display = 'block');
  document.querySelectorAll('[id^="toggle-"]').forEach(el => el.textContent = '▼');
}

function collapseAll(){
  document.querySelectorAll('.race-lanes').forEach(el => el.style.display = 'none');
  document.querySelectorAll('[id^="toggle-"]').forEach(el => el.textContent = '▶');
}

async function setRaceDay(raceId, day){
  await fetch(`/api/races/${raceId}/day`, {
    method:'PATCH', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({day: Number(day)})
  });
  loadRaceList();
}

async function swapLanes(raceId, lane, targetLane){
  if(!targetLane){ return; }
  const res = await fetch(`/api/races/${raceId}/swap-lanes`, {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({laneA: lane, laneB: Number(targetLane)})
  });
  const data = await res.json();
  if(!res.ok){ alert(data.error); return; }
  loadRaceList();
}

async function moveToRace(fromRaceId, lane, entryId, targetRaceId){
  if(!targetRaceId){ return; }
  const res = await fetch(`/api/races/${fromRaceId}/move-to-race`, {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({entryId, targetRaceId})
  });
  const data = await res.json();
  if(!res.ok){ alert(data.error); return; }
  loadRaceList();
}

async function scratchLane(raceId, lane){
  await fetch(`/api/races/${raceId}/scratch-lane/${lane}`, { method:'POST' });
  loadRaceList();
}
async function setSchedule(raceId, scheduledLabel){
  await fetch(`/api/races/${raceId}/schedule`, { method:'PATCH', headers:{'Content-Type':'application/json'}, body: JSON.stringify({scheduledLabel}) });
}
async function setGap(raceId, gapAfterMinutes){
  const res = await fetch(`/api/programme/races/${raceId}/gap`, {
    method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({gapAfterMinutes: gapAfterMinutes === '' ? null : Number(gapAfterMinutes)})
  });
  const data = await res.json();
  if(!res.ok){ alert(data.error); return; }
  await loadRaceList();
}
async function addBreak(){
  const meetId = getMeetId();
  const label = document.getElementById('newBreakLabel').value;
  const durationMinutes = document.getElementById('newBreakDuration').value;
  const afterSel = document.getElementById('newBreakAfter');
  const afterRaceId = afterSel.value;
  const day = Number(afterSel.selectedOptions[0].dataset.day) || 1;
  if(!durationMinutes){ alert('How many minutes does this need?'); return; }
  const res = await fetch('/api/programme/breaks', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({meetId, day, label, durationMinutes: Number(durationMinutes), afterRaceId: afterRaceId || null})
  });
  const data = await res.json();
  if(!res.ok){ alert(data.error); return; }
  document.getElementById('newBreakLabel').value = '';
  document.getElementById('newBreakDuration').value = '';
  await loadRaceList();
}
async function editBreakLabel(breakId, label){
  const res = await fetch(`/api/programme/breaks/${breakId}`, { method:'PATCH', headers:{'Content-Type':'application/json'}, body: JSON.stringify({label}) });
  const data = await res.json();
  if(!res.ok){ alert(data.error); return; }
}
async function editBreakDuration(breakId, durationMinutes){
  const res = await fetch(`/api/programme/breaks/${breakId}`, { method:'PATCH', headers:{'Content-Type':'application/json'}, body: JSON.stringify({durationMinutes: Number(durationMinutes)}) });
  const data = await res.json();
  if(!res.ok){ alert(data.error); return; }
  await loadRaceList();
}
async function moveBreakTo(breakId, target){
  const res = await fetch(`/api/programme/breaks/${breakId}/move`, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({target}) });
  const data = await res.json();
  if(!res.ok){ alert(data.error); return; }
  await loadRaceList();
}
async function deleteBreak(breakId){
  if(!(await customConfirm('Delete this space keeper? This cannot be undone.'))) return;
  const res = await fetch(`/api/programme/breaks/${breakId}`, { method:'DELETE' });
  const data = await res.json();
  if(!res.ok){ alert(data.error); return; }
  await loadRaceList();
}
async function deleteRace(raceId){
  if(!(await customConfirm('Delete this race? This cannot be undone.'))) return;
  const res = await fetch(`/api/races/${raceId}`, { method:'DELETE' });
  const data = await res.json();
  if(!res.ok){ alert(data.error); return; }
  loadEvents();
  loadRaceList();
}
async function mergeSelected(){
  const ids = [...document.querySelectorAll('.merge-check:checked')].map(c => c.value);
  if(ids.length < 2){ alert('Select at least 2 heats to merge.'); return; }
  const res = await fetch('/api/programme/merge-races', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({raceIds: ids}) });
  const data = await res.json();
  if(!res.ok){ alert(data.error); return; }
  loadRaceList();
}




async function init(){
  await initMeetBar('meetBar', {allowCreate:false});
  renderProgressStrip('progressStrip');
  const meetId = getMeetId();
  if(!meetId){ document.getElementById('meetWarning').style.display = 'block'; return; }
  await loadEvents();
  await loadAdvanceTable();
  await loadRaceList();
  setInterval(loadAdvanceTable, 5000);
}
init();
