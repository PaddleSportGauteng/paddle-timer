<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Tower — PaddleSport Gauteng</title>
<link rel="stylesheet" href="style.css">
<style>

  .day-tabs { display:flex; gap:6px; margin-bottom:16px; flex-wrap:wrap; }
  .day-tab { padding:7px 18px; border-radius:20px; border:2px solid var(--line); background:#fff; font-weight:600; font-size:13px; cursor:pointer; }
  .day-tab.active { background:var(--navy); color:#fff; border-color:var(--navy); }

  /* NOW RACING card */
  .now-card { background:#fff; border-radius:14px; border:3px solid var(--orange); padding:20px; margin-bottom:20px; box-shadow:0 4px 16px rgba(0,0,0,0.08); }
  .now-card .badge { font-size:11px; font-weight:700; letter-spacing:0.08em; color:var(--orange); text-transform:uppercase; margin-bottom:4px; }
  .now-card .race-title { font-size:18px; font-weight:700; color:var(--navy); margin-bottom:2px; }
  .now-card .race-sub { font-size:13px; color:var(--gray); margin-bottom:14px; }

  .big-clock { font-size:48px; font-weight:700; font-family:monospace; text-align:center; color:var(--orange); letter-spacing:2px; margin:6px 0; }
  .big-clock.stopped { color:var(--green); }

  .ctrl-row { display:flex; gap:8px; margin:12px 0; }
  .ctrl-row button { flex:1; padding:14px 10px; font-size:15px; font-weight:700; border-radius:10px; border:none; cursor:pointer; }
  .btn-start { background:#27ae60; color:#fff; }
  .btn-start:disabled { background:#b7e4c7; cursor:not-allowed; color:#fff; }
  .btn-stop  { background:#C93B3B; color:#fff; }
  .btn-stop:disabled { background:#f0b0b0; cursor:not-allowed; color:#fff; }
  .btn-undo  { background:#888; color:#fff; }
  .btn-lock  { background:var(--orange); color:#fff; }
  .btn-lock:disabled { background:#f0b48a; cursor:not-allowed; color:#fff; }

  .tap-btn { width:100%; padding:44px 20px; font-size:30px; font-weight:800; background:var(--orange); color:#fff; border:none; border-radius:14px; cursor:pointer; margin:10px 0; transition:transform 0.05s, background 0.05s; }
  .tap-btn:active { transform:scale(0.97); background:#d4420a; }

  /* Assignment table */
  .assign-table { width:100%; border-collapse:collapse; margin-top:14px; }
  .assign-table th { font-size:11px; color:var(--gray); font-weight:700; letter-spacing:0.06em; padding:4px 8px; text-align:left; border-bottom:2px solid var(--line); }
  .assign-table td { padding:8px 8px; border-bottom:1px dashed var(--line); vertical-align:middle; }
  .assign-table td:last-child { width:150px; }
  .assign-table tr.assigned td { background:#f0faf4; }
  .assign-table tr.assigned .lane-cell { color:var(--green); font-weight:700; }
  .pos-cell { font-weight:700; color:var(--navy); width:36px; font-size:16px; }
  .time-cell { font-family:monospace; font-size:16px; font-weight:700; width:90px; }
  .lane-cell { width:50px; font-size:15px; font-weight:700; }
  .name-cell { font-size:13px; color:var(--gray); }
  .lane-input { width:60px; font-size:20px; padding:8px; text-align:center; border-radius:8px; border:2px solid var(--orange); font-family:monospace; font-weight:700; display:inline-block; background:#fff; }
  .lane-input:focus { outline:none; border-color:var(--navy); }

  /* Results review */
  .review-table { width:100%; border-collapse:collapse; margin-top:14px; font-family:Arial,sans-serif; }
  .review-table th { font-size:11px; color:var(--gray); font-weight:700; letter-spacing:0.06em; padding:4px 6px; text-align:left; border-bottom:2px solid var(--line); }
  .review-table td { padding:6px 6px; border-bottom:1px dashed var(--line); vertical-align:middle; font-size:12px; text-transform:uppercase; letter-spacing:0.02em; overflow:hidden; }
  .review-table td.pname { font-weight:700; word-break:break-word; white-space:normal; width:165px; text-transform:uppercase; }
  .review-table td.pmeta { color:var(--gray); white-space:nowrap; }
  .review-table td.cpos  { width:32px; font-weight:700; color:var(--navy); font-size:14px; }
  .review-table td.clane { width:46px; font-weight:700; color:var(--gray); }
  .review-table td.cage  { width:52px; }
  .review-table td.cclub { width:48px; }
  .review-table td.csex  { width:22px; }
  .review-table td.cunion{ width:40px; }
  .review-table td.cpsa  { width:50px; }
  .review-table td.ctime { width:82px; font-family:monospace; font-weight:700; color:var(--green); font-size:13px; }
  .review-table .bad { color:#C93B3B; font-weight:700; }

  /* Upcoming */
  .section-label { font-size:13px; font-weight:700; color:var(--gray); letter-spacing:0.06em; margin:16px 0 8px; }
  .upcoming-card { background:#fff; border-radius:10px; border:1px solid var(--line); padding:14px 16px; margin-bottom:8px; display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .upcoming-card .u-title { font-weight:700; font-size:14px; color:var(--navy); }
  .upcoming-card .u-sub { font-size:12px; color:var(--gray); margin-top:2px; }
  .upcoming-card .u-time { font-size:13px; color:var(--orange); font-weight:600; white-space:nowrap; }
  .finished-card { background:#f8f8f8; border-radius:10px; border:1px solid var(--line); padding:10px 16px; margin-bottom:6px; display:flex; align-items:center; justify-content:space-between; font-size:13px; color:var(--gray); }
  .finished-pill { background:#E4F5EC; color:#1E8E5A; border-radius:20px; padding:3px 10px; font-size:11px; font-weight:700; }

  /* Mass start bib form */
  .bib-form { display:flex; gap:8px; margin:12px 0; }
  .bib-form input { flex:1; font-size:28px; padding:12px; text-align:center; border-radius:10px; border:2px solid var(--orange); font-family:monospace; font-weight:700; }
  .bib-form button { font-size:16px; padding:12px 20px; border-radius:10px; font-weight:700; }
  .lap-table { width:100%; border-collapse:collapse; margin-top:10px; font-family:Arial,sans-serif; }
  .lap-table th { padding:4px 6px; text-align:left; border-bottom:2px solid var(--line); font-size:11px; color:var(--gray); font-weight:700; letter-spacing:0.06em; }
  .lap-table td { padding:6px 6px; border-bottom:1px dashed var(--line); font-size:12px; text-transform:uppercase; letter-spacing:0.02em; }
  .lap-table td.pname { font-weight:700; width:165px; text-transform:uppercase; }
  .lap-table td.pmeta { color:var(--gray); white-space:nowrap; }
  .lap-table td.clane { width:46px; font-weight:700; color:var(--gray); font-family:monospace; }
  .lap-table td.cage{width:52px;} .lap-table td.cclub{width:48px;} .lap-table td.csex{width:22px;}
  .lap-table td.cunion{width:40px;} .lap-table td.cpsa{width:50px;}
  .lap-table td.ctime { width:82px; font-family:monospace; font-weight:700; color:var(--green); font-size:13px; }
  .lap-table tr.done td { background:#f0faf4; }
</style>
</head>
<body>
<header class="topbar">
  <a href="/" class="title"><img src="/psg-logo.jpg" alt="PSG" class="psg-logo"> PaddleSport Gauteng</a>
  <nav>
    <a href="/admin.html">Race Office</a>
    <a href="/race-sort.html">Race Sort</a>
    <a href="/draw.html">Draw</a>
    <a href="/program.html">Race Program</a>
    <a href="/tower.html">Tower</a>
    <a href="/weigh.html">Weigh</a>
    <a href="/results.html">Results</a>
    <a href="/board.html">Board</a>
  </nav>
  <div id="meetBar"></div>
</header>

<main>
  <div class="flag" id="meetWarning" style="display:none">No meet selected — pick one at the top right first.</div>
  <div class="day-tabs" id="dayTabs"></div>
  <div id="runningSection"></div>
  <div id="upcomingSection"></div>
  <div id="finishedSection"></div>
</main>

<script src="common.js"></script>
<script>
let selectedDay = 1;
let racesById = {};
let tickHandles = {};

function phaseLabel(r){
  const m={heat:`Heat ${r.heatNumber}`,semi:`Semi ${r.heatNumber}`,final:'Final A',finalB:'Final B',finalC:'Final C'};
  return m[r.phase]||r.phase;
}
function raceLabel(r){
  const lbl = r.combinedLabel || (r.event && r.event.label) || '';
  return `R${r.raceNumber} · ${lbl} — ${phaseLabel(r)}`;
}
function raceSub(r){ const p=[]; if(r.scheduledLabel)p.push(r.scheduledLabel); if(r.isMassStart)p.push(`Mass start · ${r.totalLaps} laps`); return p.join(' · '); }
function fmtTime(ms){
  if(ms==null||ms===undefined) return '—';
  const cs=Math.floor(ms/10)%100, s=Math.floor(ms/1000)%60, m=Math.floor(ms/60000);
  return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}.${String(cs).padStart(2,'0')}`;
}

// ── Day tabs ──────────────────────────────────────────────────────
function buildDayTabs(races){
  const days=[...new Set(races.map(r=>r.day||1))].sort((a,b)=>a-b);
  const el=document.getElementById('dayTabs');
  if(days.length<=1){el.innerHTML='';return;}
  el.innerHTML=days.map(d=>`<button class="day-tab ${d===selectedDay?'active':''}" onclick="switchDay(${d})">Day ${d}</button>`).join('');
}
function switchDay(d){ selectedDay=d; refresh(); }

// ── Main refresh ──────────────────────────────────────────────────
async function refresh(force){
  // Don't re-render while the user is typing a lane number — the periodic
  // poll would destroy the input element and wipe what they've typed.
  if(!force){
    const active = document.activeElement;
    if(active && active.classList && active.classList.contains('lane-input')) return;
  }
  const meetId=getMeetId(); if(!meetId)return;
  let races;
  try{ races=await(await fetch(`/api/races/active?meetId=${encodeURIComponent(meetId)}`)).json(); }
  catch(e){ return; }
  const scrollY = window.scrollY;
  buildDayTabs(races);
  races.forEach(r=>{ racesById[r.id]=r; });
  const day=races.filter(r=>(r.day||1)===selectedDay);
  renderRunning(day.filter(r=>r.status==='running'));
  renderUpcoming(day.filter(r=>r.status==='pending'));
  renderFinished(day.filter(r=>r.status==='finished'));
  window.scrollTo(0, scrollY);
}

// ── Tick ──────────────────────────────────────────────────────────
function startTick(race){
  if(tickHandles[race.id]) cancelAnimationFrame(tickHandles[race.id]);
  function tick(){
    const el=document.getElementById('clock-'+race.id); if(!el){delete tickHandles[race.id];return;}
    const ms=race.stopTimeMs ? race.stopTimeMs-race.startTimeMs : Date.now()-race.startTimeMs;
    el.textContent=fmtTime(ms);
    if(!race.stopTimeMs) tickHandles[race.id]=requestAnimationFrame(tick);
  }
  tick();
}

// ── Running races ─────────────────────────────────────────────────
function renderRunning(races){
  const el=document.getElementById('runningSection');
  el.innerHTML=races.map(r=>r.isMassStart?massCardHtml(r):laneCardHtml(r)).join('');
  races.forEach(r=>startTick(r));
}

function laneCardHtml(race){
  const crossings=race.blindCrossings||[];
  const realLanes=Object.entries(race.laneEntries||{}).filter(([,i])=>i).sort((a,b)=>Number(a[0])-Number(b[0]));
  const allDone=realLanes.every(([,info])=>race.results[info.entryId]);
  const stopped=!!race.stopTimeMs;

  // Build assignment rows — one per crossing, sorted by position
  const assignRows=crossings.map(c=>{
    const assigned=c.assignedLane!=null;
    const info=assigned?race.laneEntries[c.assignedLane]:null;
    return `<tr class="${assigned?'assigned':''}">
      <td class="pos-cell">${c.position}</td>
      <td class="time-cell">${fmtTime(c.timeMs)}</td>
      <td class="lane-cell">${assigned?c.assignedLane:''}</td>
      <td class="name-cell">${info?info.names[0]:''}</td>
      <td>${assigned
        ? `<span style="display:inline-flex;gap:5px;align-items:center">
             <button onclick="unassignCrossing('${race.id}',${c.position})" style="font-size:11px;padding:4px 9px;background:var(--orange);color:#fff;border:none;border-radius:5px;cursor:pointer" title="Change the lane — keeps the time">Edit</button>
             <button onclick="clearCrossing('${race.id}',${c.position})" style="font-size:11px;padding:4px 8px;background:#C93B3B;color:#fff;border:none;border-radius:5px;cursor:pointer" title="Delete this crossing and its time">✕</button>
           </span>`
        : `<span style="display:inline-flex;gap:6px;align-items:center">
             <input class="lane-input" type="text" inputmode="numeric" placeholder="L#" data-race="${race.id}" data-pos="${c.position}" autocomplete="off">
             <button onclick="clearCrossing('${race.id}',${c.position})" style="font-size:11px;padding:4px 8px;background:#C93B3B;color:#fff;border:none;border-radius:5px;cursor:pointer" title="Delete this extra tap">✕</button>
           </span>`
      }</td>
    </tr>`;
  }).join('');

  // Review rows — sorted by finish position
  const reviewRows=realLanes.slice().sort((a,b)=>{
    const ra=race.results[(a[1]||{}).entryId], rb=race.results[(b[1]||{}).entryId];
    const pa=ra&&ra.status==='OK'?ra.position:999, pb=rb&&rb.status==='OK'?rb.position:999;
    return pa-pb;
  }).map(([lane,info])=>{
    const r=race.results[info.entryId];
    let timeCell='<span style="color:var(--gray)">—</span>';
    let posCell='';
    if(r&&r.status==='OK'){ timeCell=fmtTime(r.finishTimeMs); posCell=r.position; }
    else if(r){ timeCell=`<span class="bad">${r.status}</span>`; }
    const g=info.gender?(info.gender.toLowerCase().startsWith('f')?'F':info.gender.toLowerCase().startsWith('m')?'M':info.gender):'';
    const isK2 = info.names.length>1;
    const nameCell = isK2
      ? `${info.names[0]}<br>${info.names[1]}`
      : info.names[0];
    return `<tr>
      <td class="cpos">${posCell}</td>
      <td class="clane">L${lane}</td>
      <td class="pname">${nameCell}</td>
      <td class="pmeta cage">${info.ageCategory||''}</td>
      <td class="pmeta cclub">${info.clubCode||''}</td>
      <td class="pmeta csex">${g}</td>
      <td class="pmeta cunion">${info.union||''}</td>
      <td class="pmeta cpsa">${(info.psaIds||[])[0]||''}</td>
      <td class="ctime">${timeCell}</td>
      <td style="white-space:nowrap;width:150px">
        <button style="font-size:10px;padding:3px 5px" onclick="markLane('${race.id}','${info.entryId}','DNS')">DNS</button>
        <button style="font-size:10px;padding:3px 5px" onclick="markLane('${race.id}','${info.entryId}','DNF')">DNF</button>
        <button style="font-size:10px;padding:3px 5px" onclick="markDQ('${race.id}','${info.entryId}')">DQ</button>
        ${r?`<button style="font-size:10px;padding:3px 5px" onclick="clearResult('${race.id}','${info.entryId}')">✕</button>`:''}
      </td>
    </tr>`;
  }).join('');

  return `<div class="now-card" id="race-${race.id}">
    <div class="badge">🔴 Now Racing</div>
    <div class="race-title">${raceLabel(race)}</div>
    <div class="race-sub">${raceSub(race)}</div>
    <div class="big-clock ${stopped?'stopped':''}" id="clock-${race.id}">00:00.00</div>
    ${!stopped?`<button class="tap-btn" onclick="tap('${race.id}')">TAP — BOAT CROSSED ⚡</button>`:''}
    <div class="ctrl-row">
      <button class="btn-start" disabled>▶ Started</button>
      <button class="btn-stop" ${stopped?'disabled':''} onclick="stopClock('${race.id}')">⏹ Stop</button>
      <button class="btn-undo" onclick="undoTap('${race.id}')">↩ Undo tap</button>
      <button class="btn-lock" ${allDone?'':'disabled'} onclick="lockRace('${race.id}')">🔒 Lock</button>
    </div>

    ${crossings.length?`
    <table class="assign-table">
      <tr><th>POS</th><th>TIME</th><th>LANE</th><th>PADDLER</th><th></th></tr>
      ${assignRows}
    </table>`:''}

    ${allDone?`
    <div style="margin-top:14px">
      <div style="font-size:11px;font-weight:700;letter-spacing:0.06em;color:var(--gray);margin-bottom:6px">✓ ALL ASSIGNED — REVIEW THEN LOCK</div>
      <table class="review-table">
        <tr><th></th><th>LANE</th><th>NAME</th><th>AGE</th><th>CLUB</th><th>M/F</th><th>UNION</th><th>PSA</th><th>TIME</th><th></th></tr>
        ${reviewRows}
      </table>
    </div>`:`
    <table class="review-table" style="margin-top:10px">
      <tr><th></th><th>LANE</th><th>NAME</th><th>AGE</th><th>CLUB</th><th>M/F</th><th>UNION</th><th>PSA</th><th>TIME</th><th></th></tr>
      ${reviewRows}
    </table>`}
  </div>`;
}

function massCardHtml(race){
  const bibs=Object.entries(race.laneEntries||{}).filter(([,i])=>i).sort((a,b)=>Number(a[0])-Number(b[0]));
  const allDone=bibs.every(([,info])=>race.results[info.entryId]);
  const stopped=!!race.stopTimeMs;
  const rows=bibs.map(([bib,info])=>{
    const laps=info.laps||[];
    const done=laps.length>=race.totalLaps;
    const r=race.results[info.entryId];
    let res='';
    if(r&&r.status==='OK') res=`<span style="color:var(--green);font-family:monospace;font-weight:700">${fmtTime(r.finishTimeMs)}</span>`;
    else if(r) res=`<span style="color:#C93B3B;font-weight:700">${r.status}</span>`;
    const g=info.gender?(info.gender.toLowerCase().startsWith('f')?'F':info.gender.toLowerCase().startsWith('m')?'M':info.gender):'';
    return `<tr class="${done?'done':''}">
      <td class="clane">${bib}</td>
      <td class="pname">${info.names[0]}</td>
      <td class="pmeta cage">${info.ageCategory||''}</td>
      <td class="pmeta cclub">${info.clubCode||''}</td>
      <td class="pmeta csex">${g}</td>
      <td class="pmeta cunion">${info.union||''}</td>
      <td class="pmeta cpsa">${(info.psaIds||[])[0]||''}</td>
      <td class="pmeta">${laps.length}/${race.totalLaps}${done?' ✓':''}</td>
      <td class="ctime">${laps.length?fmtTime(laps[laps.length-1].timeMs):'—'}</td>
      <td>${res}</td>
      <td style="white-space:nowrap;width:170px">
        ${laps.length?`<button style="font-size:10px;padding:3px 5px" onclick="undoLap('${race.id}','${bib}')">↩</button>`:''}
        <button style="font-size:10px;padding:3px 5px" onclick="markLane('${race.id}','${info.entryId}','DNS')">DNS</button>
        <button style="font-size:10px;padding:3px 5px" onclick="markLane('${race.id}','${info.entryId}','DNF')">DNF</button>
        <button style="font-size:10px;padding:3px 5px" onclick="markDQ('${race.id}','${info.entryId}')">DQ</button>
        ${r?`<button style="font-size:10px;padding:3px 5px" onclick="clearResult('${race.id}','${info.entryId}')">✕</button>`:''}
      </td>
    </tr>`;
  }).join('');

  return `<div class="now-card" id="race-${race.id}">
    <div class="badge">🔴 Now Racing — Mass Start</div>
    <div class="race-title">${raceLabel(race)}</div>
    <div class="race-sub">${raceSub(race)}</div>
    <div class="big-clock ${stopped?'stopped':''}" id="clock-${race.id}">00:00.00</div>
    <form class="bib-form" onsubmit="return submitBib(event,'${race.id}')">
      <input type="text" inputmode="numeric" placeholder="Slide #" autocomplete="off">
      <button class="primary" type="submit">Log pass</button>
    </form>
    <div class="ctrl-row">
      <button class="btn-start" disabled>▶ Started</button>
      <button class="btn-stop" ${stopped?'disabled':''} onclick="stopClock('${race.id}')">⏹ Stop</button>
      <button class="btn-undo" onclick="undoLap('${race.id}',null)">↩ Undo last</button>
      <button class="btn-lock" ${allDone?'':'disabled'} onclick="lockRace('${race.id}')">🔒 Lock</button>
    </div>
    <table class="lap-table">
      <tr><th>SLIDE</th><th>NAME</th><th>AGE</th><th>CLUB</th><th>M/F</th><th>UNION</th><th>PSA</th><th>LAPS</th><th>LAST</th><th>RESULT</th><th></th></tr>
      ${rows||'<tr><td colspan="6" style="color:var(--gray)">No entries.</td></tr>'}
    </table>
  </div>`;
}

// ── Upcoming / Finished ───────────────────────────────────────────
function renderUpcoming(races){
  const el=document.getElementById('upcomingSection');
  if(!races.length){el.innerHTML='';return;}
  el.innerHTML=`<div class="section-label">UP NEXT</div>`+races.map((r,i)=>`
    <div class="upcoming-card">
      <div>
        <div class="u-title">${raceLabel(r)}</div>
        <div class="u-sub">${lanesPreview(r)}</div>
      </div>
      <div style="display:flex;align-items:center;gap:6px">
        ${r.scheduledLabel?`<span class="u-time">${r.scheduledLabel}</span>`:''}
        <button onclick="reorderRace('${r.id}','up')" ${i===0?'disabled':''} style="padding:6px 10px;border-radius:6px;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:14px" title="Move up">▲</button>
        <button onclick="reorderRace('${r.id}','down')" ${i===races.length-1?'disabled':''} style="padding:6px 10px;border-radius:6px;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:14px" title="Move down">▼</button>
        <button class="btn-start" style="padding:10px 18px;border-radius:8px;border:none;cursor:pointer;font-weight:700;font-size:14px;white-space:nowrap" onclick="startRace('${r.id}')">▶ Start</button>
      </div>
    </div>`).join('');
}
function lanesPreview(r){
  const lanes=Object.entries(r.laneEntries||{}).filter(([,i])=>i).slice(0,4);
  return lanes.map(([l,i])=>`L${l}: ${i.names[0]}`).join(' · ')+(Object.values(r.laneEntries||{}).filter(Boolean).length>4?' …':'');
}
function renderFinished(races){
  const el=document.getElementById('finishedSection');
  if(!races.length){el.innerHTML='';return;}
  el.innerHTML=`<div class="section-label">FINISHED</div>`+races.map(r=>`
    <div class="finished-card">
      <span>${raceLabel(r)}</span>
      <span class="finished-pill">✓ Done</span>
    </div>`).join('');
}

// ── Actions ───────────────────────────────────────────────────────
async function reorderRace(id, direction){
  const res = await fetch(`/api/races/${id}/reorder`, {
    method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({direction})
  });
  if(!res.ok){ const d=await res.json(); alert(d.error); return; }
  await refresh();
}

async function startRace(id){
  const res=await fetch(`/api/races/${id}/start`,{method:'POST'});
  if(!res.ok){const d=await res.json();alert(d.error);return;}
  await refresh();
  setTimeout(()=>{ const b=document.querySelector(`#race-${id} .tap-btn`); if(b)b.focus(); },100);
}
async function tap(raceId){
  const race = racesById[raceId];
  if(!race || !race.startTimeMs) return;
  // Optimistic local update so the time shows instantly
  const timeMs = Date.now() - race.startTimeMs;
  if(!race.blindCrossings) race.blindCrossings = [];
  race.blindCrossings.push({position: race.blindCrossings.length + 1, timeMs, assignedLane: null});
  renderRunning([race]);
  startTick(race);
  // Sync to server, then do a full refresh to get authoritative data
  try {
    const res = await fetch(`/api/races/${raceId}/capture-crossing`, {method:'POST'});
    if(!res.ok){ const d = await res.json(); alert(d.error); }
  } catch(e){}
  await refresh(true);
}
async function undoTap(raceId){
  const res=await fetch(`/api/races/${raceId}/undo-crossing`,{method:'POST'});
  if(!res.ok){const d=await res.json();alert(d.error);return;}
  await refresh();
}
async function assignCrossing(raceId,position,laneVal){
  const lane=Number(laneVal); if(!lane){ return; }
  const res=await fetch(`/api/races/${raceId}/assign-crossing`,{
    method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({position:Number(position),lane})
  });
  const data=await res.json();
  if(!res.ok){alert(data.error);return;}
  // Full refresh — the assign endpoint doesn't return the event field the
  // renderer needs, so re-fetch the complete race list instead.
  await refresh(true);
  // Focus the next unassigned input so you can keep typing
  setTimeout(()=>{
    const next=document.querySelector(`#race-${raceId} .lane-input`);
    if(next) next.focus();
  },30);
}
async function unassignCrossing(raceId,position){
  const res=await fetch(`/api/races/${raceId}/unassign-crossing`,{
    method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({position})
  });
  if(!res.ok){const d=await res.json();alert(d.error);return;}
  await refresh(true);
  // Focus the now-empty input so you can retype straight away
  setTimeout(()=>{
    const inp=document.querySelector(`#race-${raceId} .lane-input[data-pos="${position}"]`);
    if(inp) inp.focus();
  },30);
}

async function clearCrossing(raceId,position){
  const res=await fetch(`/api/races/${raceId}/delete-crossing`,{
    method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({position})
  });
  if(!res.ok){const d=await res.json();alert(d.error);return;}
  await refresh();
}
async function stopClock(raceId){
  const res=await fetch(`/api/races/${raceId}/stop-clock`,{method:'POST'});
  if(!res.ok){const d=await res.json();alert(d.error);return;}
  await refresh();
}
async function lockRace(raceId){
  const race=racesById[raceId];
  if(race){
    const realLanes=Object.entries(race.laneEntries||{}).filter(([,i])=>i);
    const missing=realLanes.filter(([,info])=>!race.results[info.entryId]);
    if(missing.length){alert(`${missing.length} lane(s) still have no result — mark them DNS/DNF first.`);return;}
  }
  const ok=await customConfirm('Lock results for this race? This cannot be undone.');
  if(!ok)return;
  const res=await fetch(`/api/races/${raceId}/finish-race`,{method:'POST'});
  if(!res.ok){const d=await res.json();alert(d.error);return;}
  await refresh();
}
async function markLane(raceId,entryId,status,dqReason){
  const res=await fetch(`/api/races/${raceId}/mark/${entryId}`,{
    method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({status,dqReason})
  });
  if(!res.ok){const d=await res.json();alert(d.error);return;}
  await refresh();
}
async function markDQ(raceId,entryId){
  const reason=prompt('DQ reason (optional):')||null;
  await markLane(raceId,entryId,'DQ',reason);
}
async function clearResult(raceId,entryId){
  const res=await fetch(`/api/races/${raceId}/undo/${entryId}`,{method:'POST'});
  if(!res.ok){const d=await res.json();alert(d.error);return;}
  await refresh();
}
async function submitBib(evt,raceId){
  evt.preventDefault();
  const input=evt.target.querySelector('input');
  const bib=input.value.trim(); if(!bib)return false;
  input.value='';
  const res=await fetch(`/api/races/${raceId}/lap-pass`,{
    method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({bib})
  });
  const data=await res.json();
  if(!res.ok)alert(data.error);
  await refresh();
  return false;
}
async function undoLap(raceId,bib){
  if(!bib){
    const race=racesById[raceId]; if(!race)return;
    const all=[];
    Object.entries(race.laneEntries||{}).forEach(([b,info])=>{
      if(info&&info.laps) info.laps.forEach(l=>all.push({bib:b,timeMs:l.timeMs}));
    });
    if(!all.length)return;
    all.sort((a,b)=>b.timeMs-a.timeMs);
    bib=all[0].bib;
  }
  const res=await fetch(`/api/races/${raceId}/undo-lap/${bib}`,{method:'POST'});
  if(!res.ok){const d=await res.json();alert(d.error);return;}
  await refresh();
}

// Single keyboard handler - no inline handlers on inputs
document.addEventListener('keydown', function(e) {
  const isLaneInput = e.target && e.target.classList && e.target.classList.contains('lane-input');

  if(isLaneInput){
    // Swallow space so it doesn't trigger TAP
    if(e.key === ' '){ e.preventDefault(); e.stopImmediatePropagation(); return; }
    if(e.key === 'Enter'){
      e.preventDefault();
      e.stopImmediatePropagation();
      const val = e.target.value.trim();
      if(val){
        const raceId = e.target.getAttribute('data-race');
        const pos    = e.target.getAttribute('data-pos');
        e.target.value = '';
        if(raceId && pos) assignCrossing(raceId, pos, val);
      }
    }
    return; // don't let any other handler see this keydown
  }

  // Not in a lane input — global TAP shortcut
  if(e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT' || e.target.tagName === 'TEXTAREA') return;
  if(e.key === ' ' || e.key === 'Enter'){
    e.preventDefault();
    const btn = document.querySelector('.tap-btn');
    if(btn) btn.click();
  }
});

async function init(){
  await initMeetBar('meetBar',{allowCreate:false});
  if(!getMeetId()){document.getElementById('meetWarning').style.display='block';return;}
  selectedDay=1;
  await refresh();
  setInterval(refresh,1500);
}
init();
