<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Tower — Paddle Timer</title>
<link rel="stylesheet" href="style.css">
<style>
  body { background: #f0f2f5; }

  /* Day tabs */
  .day-tabs { display:flex; gap:6px; margin-bottom:16px; flex-wrap:wrap; }
  .day-tab { padding:7px 18px; border-radius:20px; border:2px solid var(--line); background:#fff; font-weight:600; font-size:13px; cursor:pointer; }
  .day-tab.active { background:var(--navy); color:#fff; border-color:var(--navy); }

  /* NOW RACING card */
  .now-card { background:#fff; border-radius:14px; border:3px solid var(--orange); padding:20px; margin-bottom:20px; box-shadow:0 4px 16px rgba(0,0,0,0.08); }
  .now-card .badge { font-size:11px; font-weight:700; letter-spacing:0.08em; color:var(--orange); text-transform:uppercase; margin-bottom:4px; }
  .now-card .race-title { font-size:18px; font-weight:700; color:var(--navy); margin-bottom:4px; }
  .now-card .race-sub { font-size:13px; color:var(--gray); margin-bottom:14px; }

  /* Big clock */
  .big-clock { font-size:64px; font-weight:700; font-family:monospace; text-align:center; color:var(--navy); letter-spacing:2px; margin:10px 0; }
  .big-clock.running { color:var(--orange); }

  /* Control row */
  .ctrl-row { display:flex; gap:8px; margin:12px 0; }
  .ctrl-row button { flex:1; padding:14px 10px; font-size:15px; font-weight:700; border-radius:10px; border:none; cursor:pointer; }
  .btn-start { background:#27ae60; color:#fff; }
  .btn-start:disabled { background:#95d5b2; cursor:not-allowed; }
  .btn-stop  { background:#C93B3B; color:#fff; }
  .btn-stop:disabled  { background:#e8a0a0; cursor:not-allowed; }
  .btn-lock  { background:var(--orange); color:#fff; }
  .btn-lock:disabled  { background:#f0b48a; cursor:not-allowed; }

  /* TAP button */
  .tap-btn { width:100%; padding:40px 20px; font-size:28px; font-weight:800; background:var(--orange); color:#fff; border:none; border-radius:14px; cursor:pointer; letter-spacing:1px; margin:10px 0; active:scale(0.97); transition:transform 0.05s; }
  .tap-btn:active { transform:scale(0.97); background:#d4420a; }
  .tap-btn:disabled { background:#ccc; cursor:not-allowed; }

  /* Crossing list */
  .crossings { margin:10px 0; }
  .crossing-row { display:flex; align-items:center; gap:8px; padding:7px 10px; background:#f8f8f8; border-radius:8px; margin-bottom:5px; font-size:13px; }
  .crossing-row .pos { font-weight:700; min-width:24px; color:var(--navy); }
  .crossing-row .t { font-family:monospace; min-width:80px; }
  .crossing-row select { flex:1; font-size:12px; padding:4px; border-radius:6px; border:1px solid var(--line); }
  .crossing-assigned { color:var(--green); font-weight:600; flex:1; }

  /* Lane status mini table */
  .lane-mini { width:100%; border-collapse:collapse; font-size:13px; margin-top:10px; }
  .lane-mini td { padding:5px 8px; border-bottom:1px dashed var(--line); }
  .lane-mini td:first-child { font-weight:700; color:var(--gray); width:55px; }
  .result-ok { color:var(--green); font-family:monospace; font-weight:700; }
  .result-bad { color:#C93B3B; font-weight:700; }

  /* Bib input for mass start */
  .bib-form { display:flex; gap:8px; margin:12px 0; }
  .bib-form input { flex:1; font-size:22px; padding:12px; text-align:center; border-radius:10px; border:2px solid var(--line); font-family:monospace; }
  .bib-form button { font-size:16px; padding:12px 20px; border-radius:10px; }

  /* Mass start lap sheet */
  .lapsheet { width:100%; border-collapse:collapse; font-size:13px; margin-top:10px; }
  .lapsheet th { padding:5px 8px; text-align:left; border-bottom:2px solid var(--line); font-size:12px; color:var(--gray); }
  .lapsheet td { padding:5px 8px; border-bottom:1px dashed var(--line); }
  .lapsheet tr.done td { background:#E4F5EC; }

  /* Upcoming races */
  .upcoming-section h2 { font-size:15px; color:var(--gray); font-weight:700; letter-spacing:0.05em; margin-bottom:10px; }
  .upcoming-card { background:#fff; border-radius:10px; border:1px solid var(--line); padding:14px 16px; margin-bottom:8px; display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .upcoming-card .u-title { font-weight:700; font-size:14px; color:var(--navy); }
  .upcoming-card .u-sub { font-size:12px; color:var(--gray); margin-top:2px; }
  .upcoming-card .u-time { font-size:13px; color:var(--orange); font-weight:600; white-space:nowrap; }

  /* Finished races */
  .finished-card { background:#f8f8f8; border-radius:10px; border:1px solid var(--line); padding:12px 16px; margin-bottom:8px; display:flex; align-items:center; justify-content:space-between; }
  .finished-card .f-title { font-size:13px; color:var(--gray); }
  .finished-pill { background:#E4F5EC; color:#1E8E5A; border-radius:20px; padding:3px 10px; font-size:11px; font-weight:700; }
</style>
</head>
<body>
<header class="topbar">
  <a href="/" class="title"><img src="/psg-logo.jpg" alt="PSG" class="psg-logo"> PaddleSport Gauteng</a>
  <nav>
    <a href="/admin.html">Race Office</a>
    <a href="/race-sort.html">Race Sort</a>
    <a href="/draw.html">Draw</a>
    <a href="/program.html">Race Program</a>
    <a href="/tower.html">Tower</a>
    <a href="/weigh.html">Weigh</a>
    <a href="/results.html">Results</a>
    <a href="/board.html">Board</a>
  </nav>
  <div id="meetBar"></div>
</header>

<main>
  <div class="flag" id="meetWarning" style="display:none">No meet selected — pick one at the top-right first.</div>

  <div class="day-tabs" id="dayTabs"></div>

  <!-- Running races -->
  <div id="runningSection"></div>

  <!-- Upcoming races -->
  <div class="upcoming-section" id="upcomingSection"></div>

  <!-- Finished today -->
  <div class="upcoming-section" id="finishedSection"></div>
</main>

<script src="common.js"></script>
<script>
let selectedDay = 1;
let allDays = 1;
let racesById = {};
let raceHashes = {};
let tickHandles = {};

function phaseLabel(r){
  const map = {heat:`Heat ${r.heatNumber}`,semi:`Semi ${r.heatNumber}`,final:'Final A',finalB:'Final B',finalC:'Final C'};
  return map[r.phase] || r.phase;
}
function raceLabel(r){
  return `R${r.raceNumber} · ${r.combinedLabel || (r.event ? r.event.label : '')} — ${phaseLabel(r)}`;
}
function raceSub(r){
  const parts = [];
  if(r.scheduledLabel) parts.push(r.scheduledLabel);
  if(r.isMassStart) parts.push(`Mass start · ${r.totalLaps} laps`);
  return parts.join(' · ');
}
function fmtTime(ms){
  if(ms==null) return '00:00.00';
  const cs = Math.floor(ms/10)%100;
  const totalSec = Math.floor(ms/1000);
  const sec = totalSec%60;
  const min = Math.floor(totalSec/60);
  const pad=(n,l=2)=>String(n).padStart(l,'0');
  return `${pad(min)}:${pad(sec)}.${pad(cs)}`;
}

// ── Day tabs ──────────────────────────────────────────────────────
function buildDayTabs(races){
  const days = [...new Set(races.map(r => r.day || 1))].sort((a,b)=>a-b);
  allDays = days;
  const el = document.getElementById('dayTabs');
  if(days.length <= 1){ el.innerHTML = ''; return; }
  el.innerHTML = days.map(d =>
    `<button class="day-tab ${d===selectedDay?'active':''}" onclick="switchDay(${d})">Day ${d}</button>`
  ).join('');
}

function switchDay(d){
  selectedDay = d;
  raceHashes = {};
  refresh();
}

// ── Main render ───────────────────────────────────────────────────
async function refresh(){
  const meetId = getMeetId();
  if(!meetId) return;
  let races;
  try {
    const res = await fetch(`/api/races/active?meetId=${encodeURIComponent(meetId)}`);
    if(!res.ok) throw new Error(res.status);
    races = await res.json();
  } catch(err){
    document.getElementById('runningSection').innerHTML = `<div class="flag">Can't reach server: ${err.message}</div>`;
    return;
  }

  buildDayTabs(races);

  // Filter to selected day
  const dayRaces = races.filter(r => (r.day||1) === selectedDay);

  const running  = dayRaces.filter(r => r.status === 'running');
  const pending  = dayRaces.filter(r => r.status === 'pending');
  const finished = dayRaces.filter(r => r.status === 'finished');

  // Update racesById
  races.forEach(r => { racesById[r.id] = r; });

  renderRunning(running);
  renderUpcoming(pending);
  renderFinished(finished);
}

// ── Running races ─────────────────────────────────────────────────
function renderRunning(races){
  const el = document.getElementById('runningSection');
  if(!races.length){ el.innerHTML = ''; return; }
  el.innerHTML = races.map(r => runningCardHtml(r)).join('');
  races.forEach(r => startTick(r));
}

function runningCardHtml(race){
  if(race.isMassStart) return massCardHtml(race);

  const realLanes = Object.entries(race.laneEntries||{}).filter(([,i])=>i);

  // Lane options for crossing assignment
  const laneOpts = realLanes.map(([l,i])=>`<option value="${l}">L${l} — ${i.names[0]}</option>`).join('');

  const crossings = race.blindCrossings.map(c => {
    if(c.assignedLane != null){
      const info = race.laneEntries[c.assignedLane];
      return `<div class="crossing-row">
        <span class="pos">${c.position}</span>
        <span class="t">${fmtTime(c.timeMs)}</span>
        <span class="crossing-assigned">✓ Lane ${c.assignedLane} — ${info?info.names[0]:'?'}</span>
        <button onclick="deleteCrossing('${race.id}',${c.position})" style="font-size:11px;padding:3px 8px;background:#C93B3B;color:#fff;border:none;border-radius:5px;cursor:pointer" title="Delete this crossing">✕</button>
      </div>`;
    }
    return `<div class="crossing-row">
      <span class="pos">${c.position}</span>
      <span class="t">${fmtTime(c.timeMs)}</span>
      <input type="number" placeholder="Lane #" min="1" max="9" style="width:70px;font-size:16px;padding:6px;text-align:center;border-radius:6px;border:2px solid var(--orange);font-family:monospace;font-weight:700"
        onkeydown="if(event.key==='Enter'&&this.value){assignCrossing('${race.id}',${c.position},this.value);this.value='';}"
        onblur="if(this.value){assignCrossing('${race.id}',${c.position},this.value);this.value='';}">
      <button onclick="deleteCrossing('${race.id}',${c.position})" style="font-size:11px;padding:3px 8px;background:#C93B3B;color:#fff;border:none;border-radius:5px;cursor:pointer" title="Delete this crossing">✕</button>
    </div>`;
  }).join('');

  const laneRows = realLanes.map(([lane,info]) => {
    const r = race.results[info.entryId];
    let res = '<span style="color:var(--gray)">—</span>';
    if(r && r.status==='OK') res = `<span class="result-ok">${fmtTime(r.finishTimeMs)}</span>`;
    else if(r) res = `<span class="result-bad">${r.status}</span>`;
    // Find which crossing is assigned to this lane
    const crossing = race.blindCrossings.find(c => c.assignedLane === Number(lane));
    return `<tr>
      <td>L${lane}</td>
      <td style="font-family:Arial;font-size:12px">${info.names.join(' / ')}<br><small style="color:var(--gray)">${[info.clubCode,info.ageCategory].filter(Boolean).join(' · ')}</small></td>
      <td>${res}</td>
      <td style="white-space:nowrap">
        ${crossing ? `<input type="number" placeholder="Fix→" min="1" max="9" title="Reassign crossing ${crossing.position} to a different lane" style="width:58px;font-size:13px;padding:4px;text-align:center;border-radius:5px;border:1px solid var(--line)"
          onkeydown="if(event.key==='Enter'&&this.value){assignCrossing('${race.id}',${crossing.position},this.value);this.value='';}">` : ''}
        <button style="font-size:11px;padding:3px 6px" onclick="markLane('${race.id}','${info.entryId}','DNS')">DNS</button>
        <button style="font-size:11px;padding:3px 6px" onclick="markLane('${race.id}','${info.entryId}','DNF')">DNF</button>
        <button style="font-size:11px;padding:3px 6px" onclick="markDQ('${race.id}','${info.entryId}')">DQ</button>
        ${r?`<button style="font-size:11px;padding:3px 6px" onclick="clearResult('${race.id}','${info.entryId}')">✕</button>`:''}
      </td>
    </tr>`;
  }).join('');

  const allDone = realLanes.every(([,info]) => race.results[info.entryId]);

  const allAssigned = race.blindCrossings.length > 0 && race.blindCrossings.every(c => c.assignedLane != null);

  return `<div class="now-card" id="race-${race.id}">
    <div class="badge">🔴 Now Racing</div>
    <div class="race-title">${raceLabel(race)}</div>
    <div class="race-sub">${raceSub(race)}</div>
    <div class="big-clock ${race.stopTimeMs?'':'running'}" id="clock-${race.id}" style="${race.stopTimeMs?'color:var(--green)':''}">00:00.00</div>
    ${!race.stopTimeMs ? `<button class="tap-btn" onclick="captureCrossing('${race.id}')">TAP — BOAT CROSSED ⚡</button>` : ''}
    <div class="ctrl-row">
      <button class="btn-start" disabled>▶ Started</button>
      <button class="btn-stop" ${race.stopTimeMs?'disabled':''} onclick="stopClock('${race.id}')">⏹ Stop Clock</button>
      <button class="btn-stop" style="background:#888" onclick="undoCrossing('${race.id}')">↩ Undo tap</button>
      <button class="btn-lock" ${allDone?'':'disabled'} onclick="finishRace('${race.id}')">🔒 Lock results</button>
    </div>
    ${!allAssigned && crossings ? `<div class="crossings"><b style="font-size:12px;color:var(--gray)">CROSSINGS</b>${crossings}</div>` : ''}
    <table class="lane-mini">
      <tr><td colspan="4" style="font-size:11px;color:var(--gray);padding-bottom:4px">
        LANES ${allAssigned ? '<span style="color:var(--green);font-weight:700">✓ All assigned — review then lock</span>' : ''}
      </td></tr>
      ${laneRows}
    </table>
  </div>`;
}

function massCardHtml(race){
  const bibs = Object.entries(race.laneEntries||{}).sort((a,b)=>Number(a[0])-Number(b[0]));
  const rows = bibs.filter(([,i])=>i).map(([bib,info]) => {
    const laps = info.laps||[];
    const done = laps.length >= race.totalLaps;
    const r = race.results[info.entryId];
    let res = '';
    if(r && r.status==='OK') res = `<span class="result-ok">${fmtTime(r.finishTimeMs)}</span>`;
    else if(r) res = `<span class="result-bad">${r.status}</span>`;
    return `<tr class="${done?'done':''}">
      <td class="mono">${bib}</td>
      <td style="font-size:12px">${info.names[0]}<br><small style="color:var(--gray)">${info.clubCode||''}</small></td>
      <td>${laps.length}/${race.totalLaps}${done?' ✓':''}</td>
      <td class="mono">${laps.length?fmtTime(laps[laps.length-1].timeMs):'—'}</td>
      <td>${res}</td>
      <td style="white-space:nowrap">
        ${laps.length?`<button style="font-size:11px;padding:3px 6px" onclick="undoLap('${race.id}','${bib}')">↩</button>`:''}
        <button style="font-size:11px;padding:3px 6px" onclick="markLane('${race.id}','${info.entryId}','DNS')">DNS</button>
        <button style="font-size:11px;padding:3px 6px" onclick="markLane('${race.id}','${info.entryId}','DNF')">DNF</button>
        <button style="font-size:11px;padding:3px 6px" onclick="markDQ('${race.id}','${info.entryId}')">DQ</button>
        ${r?`<button style="font-size:11px;padding:3px 6px" onclick="clearResult('${race.id}','${info.entryId}')">✕</button>`:''}
      </td>
    </tr>`;
  }).join('');

  const allDone = bibs.filter(([,i])=>i).every(([,info]) => race.results[info.entryId]);

  return `<div class="now-card" id="race-${race.id}">
    <div class="badge">🔴 Now Racing — Mass Start</div>
    <div class="race-title">${raceLabel(race)}</div>
    <div class="race-sub">${raceSub(race)}</div>
    <div class="big-clock running" id="clock-${race.id}">00:00.00</div>
    <form class="bib-form" onsubmit="return submitBib(event,'${race.id}')">
      <input type="number" class="bib-input" placeholder="Slide #" autocomplete="off">
      <button class="primary" type="submit" style="white-space:nowrap">Log pass</button>
    </form>
    <div class="ctrl-row">
      <button class="btn-start" disabled>▶ Started</button>
      <button class="btn-stop" ${race.stopTimeMs?'disabled':''} onclick="stopClock('${race.id}')">⏹ Stop Clock</button>
      <button class="btn-stop" style="background:#888" onclick="undoLap('${race.id}', null)">↩ Undo last</button>
      <button class="btn-lock" ${allDone?'':'disabled'} onclick="finishRace('${race.id}')">🔒 Lock results</button>
    </div>
    <table class="lapsheet">
      <tr><th>Slide</th><th>Paddler</th><th>Laps</th><th>Last</th><th>Result</th><th></th></tr>
      ${rows||'<tr><td colspan="6" style="color:var(--gray)">No entries.</td></tr>'}
    </table>
  </div>`;
}

// ── Upcoming races ────────────────────────────────────────────────
function renderUpcoming(races){
  const el = document.getElementById('upcomingSection');
  if(!races.length){ el.innerHTML = ''; return; }
  el.innerHTML = `<h2>UP NEXT</h2>` + races.map(r => `
    <div class="upcoming-card">
      <div>
        <div class="u-title">${raceLabel(r)}</div>
        <div class="u-sub">${lanesPreview(r)}</div>
      </div>
      <div style="display:flex;align-items:center;gap:8px">
        ${r.scheduledLabel ? `<span class="u-time">${r.scheduledLabel}</span>` : ''}
        <button class="btn-start" style="padding:10px 18px;border-radius:8px;border:none;cursor:pointer;font-weight:700;font-size:14px" onclick="startRace('${r.id}')">▶ Start</button>
      </div>
    </div>`).join('');
}

function lanesPreview(r){
  const lanes = Object.entries(r.laneEntries||{}).filter(([,i])=>i).slice(0,4);
  return lanes.map(([l,i])=>`L${l}: ${i.names[0]}`).join(' · ') + (Object.keys(r.laneEntries||{}).length > 4 ? ' …' : '');
}

// ── Finished races ────────────────────────────────────────────────
function renderFinished(races){
  const el = document.getElementById('finishedSection');
  if(!races.length){ el.innerHTML = ''; return; }
  el.innerHTML = `<h2>FINISHED</h2>` + races.map(r => `
    <div class="finished-card">
      <div class="f-title">${raceLabel(r)}</div>
      <span class="finished-pill">✓ Done</span>
    </div>`).join('');
}

// ── Tick ──────────────────────────────────────────────────────────
function startTick(race){
  if(tickHandles[race.id]) cancelAnimationFrame(tickHandles[race.id]);
  const tick = () => {
    const el = document.getElementById('clock-'+race.id);
    if(!el){ delete tickHandles[race.id]; return; }
    const elapsed = race.stopTimeMs
      ? race.stopTimeMs - race.startTimeMs
      : Date.now() - race.startTimeMs;
    el.textContent = fmtTime(elapsed);
    if(!race.stopTimeMs){
      tickHandles[race.id] = requestAnimationFrame(tick);
    }
  };
  tick();
}

// ── Actions ───────────────────────────────────────────────────────
async function deleteCrossing(raceId, position){
  const res = await fetch(`/api/races/${raceId}/delete-crossing`, {
    method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({position})
  });
  if(!res.ok){ const d=await res.json(); alert(d.error); return; }
  await refresh();
}

async function stopClock(raceId){
  const res = await fetch(`/api/races/${raceId}/stop-clock`, {method:'POST'});
  if(!res.ok){ const d=await res.json(); alert(d.error); return; }
  await refresh();
}

async function startRace(id){
  const res = await fetch(`/api/races/${id}/start`, {method:'POST'});
  if(!res.ok){ const d=await res.json(); alert(d.error); return; }
  await refresh();
  // Focus the tap button on the newly started race
  const btn = document.querySelector(`#race-${id} .tap-btn`);
  if(btn) btn.focus();
}

async function captureCrossing(raceId){
  const res = await fetch(`/api/races/${raceId}/capture-crossing`, {method:'POST'});
  const data = await res.json();
  if(!res.ok){ alert(data.error); return; }
  await refresh();
  const btn = document.querySelector(`#race-${raceId} .tap-btn`);
  if(btn) btn.focus();
}

async function undoCrossing(raceId){
  const res = await fetch(`/api/races/${raceId}/undo-crossing`, {method:'POST'});
  if(!res.ok){ const d=await res.json(); alert(d.error); return; }
  await refresh();
}

async function assignCrossing(raceId, position, laneValue){
  const lane = Number(laneValue);
  if(!lane) return;
  const res = await fetch(`/api/races/${raceId}/assign-crossing`, {
    method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({position,lane})
  });
  const data = await res.json();
  if(!res.ok){ alert(data.error); return; }
  await refresh();
  // Focus the next unassigned crossing input
  const next = document.querySelector(`#race-${raceId} .crossings input[type="number"]`);
  if(next) next.focus();
}

async function markLane(raceId, entryId, status, dqReason){
  const res = await fetch(`/api/races/${raceId}/mark/${entryId}`, {
    method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({status,dqReason})
  });
  if(!res.ok){ const d=await res.json(); alert(d.error); return; }
  await refresh();
}
async function markDQ(raceId, entryId){
  const reason = prompt('DQ reason (optional):') || null;
  await markLane(raceId, entryId, 'DQ', reason);
}
async function clearResult(raceId, entryId){
  const res = await fetch(`/api/races/${raceId}/undo/${entryId}`, {method:'POST'});
  if(!res.ok){ const d=await res.json(); alert(d.error); return; }
  await refresh();
}

async function finishRace(raceId){
  const race = racesById[raceId];
  if(race){
    const realLanes = Object.entries(race.laneEntries||{}).filter(([,i])=>i);
    const unresolved = realLanes.filter(([,info])=>!race.results[info.entryId]);
    if(unresolved.length){
      const noun = race.isMassStart?'Slide':'Lane';
      alert(`${unresolved.length} ${noun}(s) still have no result — mark them DNS/DNF first.`);
      return;
    }
  }
  const ok = await customConfirm('Lock results for this race?');
  if(!ok) return;
  const res = await fetch(`/api/races/${raceId}/finish-race`, {method:'POST'});
  if(!res.ok){ const d=await res.json(); alert(d.error); return; }
  await refresh();
}

async function submitBib(evt, raceId){
  evt.preventDefault();
  const form = evt.target;
  const input = form.querySelector('.bib-input');
  const bib = input.value;
  if(!bib) return false;
  input.value = '';
  const res = await fetch(`/api/races/${raceId}/lap-pass`, {
    method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({bib})
  });
  const data = await res.json();
  if(!res.ok){ alert(data.error); }
  await refresh();
  return false;
}

async function undoLap(raceId, bib){
  if(!bib){
    // Undo the most recent lap pass across all bibs
    const race = racesById[raceId];
    if(!race) return;
    const allLaps = [];
    Object.entries(race.laneEntries||{}).forEach(([b,info]) => {
      if(info && info.laps) info.laps.forEach(l => allLaps.push({bib:b, timeMs:l.timeMs}));
    });
    if(!allLaps.length) return;
    allLaps.sort((a,b)=>b.timeMs-a.timeMs);
    bib = allLaps[0].bib;
  }
  const res = await fetch(`/api/races/${raceId}/undo-lap/${bib}`, {method:'POST'});
  if(!res.ok){ const d=await res.json(); alert(d.error); return; }
  await refresh();
}

// Keyboard shortcut: Enter/Space triggers TAP on the running race
document.addEventListener('keydown', e => {
  if(e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT' || e.target.tagName === 'TEXTAREA') return;
  if(e.key === ' ' || e.key === 'Enter'){
    e.preventDefault();
    const btn = document.querySelector('.tap-btn');
    if(btn) btn.click();
  }
});

async function init(){
  await initMeetBar('meetBar', {allowCreate:false});
  if(!getMeetId()){ document.getElementById('meetWarning').style.display='block'; return; }
  // Set selectedDay to 1 initially
  selectedDay = 1;
  await refresh();
  setInterval(refresh, 1500);
}
init();
