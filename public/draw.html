<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Draw — PaddleSport Gauteng</title>
<link rel="stylesheet" href="style.css">
<style>
  .events-table td, .events-table th{font-size:13px}
</style>
</head>
<body>
<header class="topbar">
  <a href="/" class="title">PaddleSport Gauteng</a>
  <nav><a href="/admin.html">Race Office</a><a href="/race-sort.html">Race Sort</a><a href="/draw.html">Draw</a><a href="/program.html">Race Program</a><a href="/start.html">Starter</a><a href="/tower.html">Tower</a><a href="/weigh.html">Weigh</a><a href="/results.html">Results</a><a href="/live.html" id="liveNavLink">Live</a></nav>
  <div id="meetBar"></div>
</header>
<main>
  <div class="flag" id="meetWarning" style="display:none">No meet selected — pick or create one at the top-right first.</div>
  <div id="meetCard"></div>
  <div id="progressStrip"></div>
  <div id="dayBar" style="margin-bottom:12px"></div>
  <div id="venueInfo" style="margin-bottom:14px"></div>



  <div class="card">
    <h2 style="margin-top:0">Draw events</h2>
        <div id="eventsTable">Loading…</div>
  </div>

  
</main>
<script src="common.js"></script>
<script>
let allEvents = [];
let selectedDay = null;

async function loadEvents(){
  const meetId = getMeetId();
  const el = document.getElementById('eventsTable');
  if(!meetId) return;
  try {
    const res = await fetch(`/api/programme/events?meetId=${encodeURIComponent(meetId)}`);
    const events = await res.json();
    allEvents = events;
    const drawable = events.filter(ev => ev.entryCount > 0);
    if(drawable.length===0){ el.innerHTML = '<p style="color:var(--gray)">No events with entries yet — import entries in Race Office.</p>'; return; }

    // Status per event
    const statusOf = ev => {
      if(ev.hasRaces && ev.drawConfirmed) return 'confirmed';
      if(ev.hasRaces) return 'drawn';
      if(ev.isMassStart) return ev.bibsAssigned ? 'ready' : 'todo';
      if(!ev.format.runnable) return 'blocked';
      return 'todo';
    };
    const order = { todo:0, blocked:1, ready:2, drawn:3, confirmed:4 };
    drawable.forEach(ev => ev._status = statusOf(ev));
    drawable.sort((a,b) => order[a._status]-order[b._status] || a.label.localeCompare(b.label));

    const counts = { confirmed:0, drawn:0, todo:0, blocked:0, ready:0 };
    drawable.forEach(ev => counts[ev._status]++);
    const canGenerateAll = drawable.some(ev => ev._status==='todo' && !ev.isMassStart);
    const canConfirmAll  = drawable.some(ev => ev._status==='drawn');

    const summary = `<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px">
      <div style="font-size:14px"><b>${counts.confirmed} of ${drawable.length}</b> confirmed
        ${counts.drawn?` · <span style="color:var(--orange)">${counts.drawn} to check</span>`:''}
        ${counts.todo?` · <span style="color:var(--gray)">${counts.todo} not drawn</span>`:''}
        ${counts.blocked?` · <span style="color:var(--red)">${counts.blocked} below minimum</span>`:''}</div>
      <div class="btn-row">
        <button class="primary" onclick="generateAll()" ${canGenerateAll?'':'disabled'}>Generate all</button>
        <button class="green" onclick="confirmAll()" ${canConfirmAll?'':'disabled'}>Confirm all</button>
      </div>
    </div>`;

    const rows = drawable.map(ev => {
      let fmtLabel = ev.format.runnable ? ev.format.rounds.join(' → ') : ev.format.reason;
      const pill = {
        confirmed:'<span class="pill ok">Confirmed</span>',
        drawn:'<span class="pill warn">Drawn — check it</span>',
        ready:'<span class="pill warn">Slides assigned</span>',
        todo:'<span class="pill" style="background:#f0f0f0;color:var(--gray)">Not drawn</span>',
        blocked:'<span class="pill bad">Below min 3</span>',
      }[ev._status];

      let action;
      if(ev._status==='confirmed'){
        action = `<button class="sm" onclick="toggleDrawView('${ev.id}')">View</button> <button class="sm" onclick="changeEvent('${ev.id}')">Change</button>`;
      } else if(ev._status==='drawn'){
        action = `<button class="sm" onclick="toggleDrawView('${ev.id}')">View</button> <button class="sm green" onclick="confirmDraw('${ev.id}')">Confirm</button> <button class="sm" onclick="changeEvent('${ev.id}')">Redraw</button>`;
      } else if(ev.isMassStart){
        action = massStartActionHtml(ev);
      } else if(ev._status==='todo'){
        action = `<button class="sm primary" onclick="generate('${ev.id}')">Generate</button>`;
      } else {
        action = `<button class="sm orange" onclick="forceFinal('${ev.id}')">Race anyway</button> <small style="color:var(--gray)">or combine it in <a href="/race-sort.html">Race Sort</a></small>`;
      }
      const label = ev.isCombined ? `<b>${ev.combinedLabel}</b> <small style="color:var(--gray)">(combined)</small>` : ev.label;
      return `<tr><td>${pill}</td><td>${label}${ev.isMassStart?' <small style="color:var(--gray)">(mass start)</small>':''}</td><td>${ev.entryCount}</td><td><small style="color:var(--gray)">${fmtLabel}</small></td><td style="white-space:nowrap">${action}</td></tr>
        <tr id="drawrow-${ev.id}" style="display:none"><td colspan="5" id="drawview-${ev.id}" style="padding:0 0 12px 0"></td></tr>`;
    }).join('');

    el.innerHTML = summary + `<div class="table-scroll"><table class="events-table"><tr><th style="width:130px">Status</th><th>Event</th><th>Entries</th><th>Format</th><th></th></tr>${rows}</table></div>`;
  } catch (err) {
    el.innerHTML = `<div class="flag">Couldn't load: ${err.message}</div>`;
  }
}

async function generateAll(){
  const todo = allEvents.filter(ev => ev.entryCount>0 && !ev.hasRaces && !ev.isMassStart && ev.format.runnable);
  if(!todo.length) return;
  if(!(await customConfirm(`Generate draws for ${todo.length} event(s)?`))) return;
  for(const ev of todo){
    await fetch(`/api/programme/events/${ev.id}/generate`, {method:'POST'});
  }
  loadEvents(); renderProgressStrip('progressStrip');
}

async function confirmAll(){
  const drawn = allEvents.filter(ev => ev.hasRaces && !ev.drawConfirmed);
  if(!drawn.length) return;
  if(!(await customConfirm(`Confirm ${drawn.length} draw(s)? Check them first if you haven't.`))) return;
  for(const ev of drawn){
    await fetch(`/api/programme/events/${ev.id}/confirm-draw`, {method:'POST'});
  }
  loadEvents(); renderProgressStrip('progressStrip');
}

function massStartActionHtml(ev){
  if(ev.hasRaces) return `<span class="pill ok">Drawn</span>`;
  if(!ev.format.runnable) return `<span class="pill bad">Below min 3</span> <small style="color:var(--gray)">combine it in <a href="/race-sort.html">Race Sort</a></small>`;
  if(!ev.bibsAssigned){
    return `<div style="display:flex;gap:6px;align-items:center">
      <input type="number" id="bibStart-${ev.id}" placeholder="Start slide #" style="width:90px;padding:6px">
      <button onclick="assignBibs('${ev.id}')">Assign slide #s</button>
    </div>`;
  }
  return `<div style="display:flex;gap:6px;align-items:center">
    <input type="number" id="laps-${ev.id}" placeholder="Laps" style="width:70px;padding:6px">
    <button onclick="createMassRace('${ev.id}')">Create race</button>
  </div>`;
}

async function assignBibs(eventId){
  const startBib = document.getElementById(`bibStart-${eventId}`).value;
  if(!startBib){ alert('Enter a starting slide number.'); return; }
  const res = await fetch(`/api/programme/events/${eventId}/assign-bibs`, {
    method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({startBib: Number(startBib)})
  });
  const data = await res.json();
  if(!res.ok){ alert(data.error); return; }
  alert(`Assigned slides ${data.range[0]}–${data.range[1]}.`);
  loadEvents();
}

async function createMassRace(eventId){
  const laps = document.getElementById(`laps-${eventId}`).value;
  if(!laps){ alert('Enter the number of laps.'); return; }
  const res = await fetch(`/api/programme/events/${eventId}/generate-mass-race`, {
    method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({totalLaps: Number(laps)})
  });
  const data = await res.json();
  if(!res.ok){ alert(data.error); return; }
  await loadEvents();
}

async function generate(eventId){
  const res = await fetch(`/api/programme/events/${eventId}/generate`, { method:'POST' });
  const data = await res.json();
  if(!res.ok){ alert(data.error); return; }
  await loadEvents();
}

async function forceFinal(eventId){
  const ok = await customConfirm('This event has fewer than 3 boats. Race it anyway? It\'ll be flagged as manually overridden so it\'s not mistaken for an oversight.');
  if(!ok) return;
  const res = await fetch(`/api/programme/events/${eventId}/force-final`, { method:'POST' });
  const data = await res.json();
  if(!res.ok){ alert(data.error); return; }
  await loadEvents();
}

async function confirmDraw(eventId){
  const res = await fetch(`/api/programme/events/${eventId}/confirm-draw`, { method:'POST' });
  const data = await res.json();
  if(!res.ok){ alert(data.error); return; }
  await loadEvents();
}

async function toggleDrawView(eventId){
  const row = document.getElementById(`drawrow-${eventId}`);
  const inner = document.getElementById(`drawview-${eventId}`);
  const isOpen = row.style.display !== 'none';
  if(isOpen){ row.style.display = 'none'; return; }
  row.style.display = 'table-row';
  inner.innerHTML = 'Loading…';
  try {
    const data = await (await fetch(`/api/programme/events/${eventId}/races`)).json();
    const races = data.races;
    if(races.length === 0){ inner.innerHTML = '<span style="color:var(--gray)">No races.</span>'; return; }
    inner.innerHTML = races.map(r => {
      const lanes = Object.entries(r.laneEntries).sort((a,b) => Number(a[0])-Number(b[0]));
      const rows = lanes.map(([lane, info]) => {
        if(!info) return `<tr><td class="clane">${r.isMassStart?'S':'L'}${lane}</td><td colspan="6" style="color:var(--gray)">— EMPTY —</td></tr>`;
        const g = info.gender ? (info.gender.toLowerCase().startsWith('f') ? 'F' : info.gender.toLowerCase().startsWith('m') ? 'M' : info.gender) : '';
        const nameCell = info.names.length > 1 ? `${info.names[0]}<br>${info.names[1]}` : info.names[0];
        return `<tr>
          <td class="clane">${r.isMassStart?'S':'L'}${lane}</td>
          <td class="pname">${nameCell}</td>
          <td class="pmeta cage">${info.ageCategory||''}</td>
          <td class="pmeta cclub">${info.clubCode||''}</td>
          <td class="pmeta csex">${g}</td>
          <td class="pmeta cunion">${info.union||''}</td>
          <td class="pmeta cpsa">${(info.psaIds||[])[0]||''}</td>
        </tr>`;
      }).join('');
      const phaseLabel = { heat: `Heat ${r.heatNumber}`, semi: `Semi ${r.heatNumber}`, final: 'Final A', finalB: 'Final B', finalC: 'Final C' }[r.phase] || r.phase;
      return `<div style="margin-bottom:10px;padding:10px;background:var(--paper);border-radius:6px">
        <div style="font-weight:700;font-size:13px;margin-bottom:6px">R${r.raceNumber} — ${phaseLabel}${r.placeholder ? ' <span class="pill warn">TBC — pending qualifiers</span>' : ''}${r.scheduledLabel ? ` — ${r.scheduledLabel}` : ''}</div>
        <div class="table-scroll"><table class="review-table" style="margin-top:0">
          <tr><th>${r.isMassStart?'SLIDE':'LANE'}</th><th>NAME</th><th>AGE</th><th>CLUB</th><th>M/F</th><th>UNION</th><th>PSA #</th></tr>
          ${rows}
        </table></div>
      </div>`;
    }).join('');
  } catch (err) {
    inner.innerHTML = `<div class="flag">Couldn't load: ${err.message}</div>`;
  }
}

async function changeEvent(eventId){
  // "Change" = delete whatever race(s) this event is part of, so it goes
  // back to undrawn (and un-combines, if it was a combined group) ready
  // to redo above.
  const races = await (await fetch(`/api/programme/events/${eventId}/races`)).json();
  const pending = races.races.filter(r => r.status === 'pending');
  if(pending.length === 0){ alert('This has already started or finished — can\'t change it from here.'); return; }
  const ok = await customConfirm('Undo this draw? It goes back to undrawn/uncombined so you can redo it.');
  if(!ok) return;
  for(const r of pending){
    await fetch(`/api/races/${r.id}`, { method:'DELETE' });
  }
  await loadEvents();
}

async function loadVenueInfo(){
  const meetId = getMeetId();
  const el = document.getElementById('venueInfo');
  try {
    const meets = await (await fetch('/api/meets')).json();
    const meet = meets.find(m => m.id === meetId);
    if(!meet){ el.innerHTML = ''; return; }
    const anyRaces = allEvents.some(ev => ev.hasRaces);
    const std = meet.lanes === 9;
    el.innerHTML = `<div class="flag" style="background:${std?'#EAF1FA':'#FFF3E0'};border-color:${std?'#B8D0EA':'#F3C98B'};color:${std?'#1a3a5c':'#8A5A12'}">
      <b>${meet.name}</b> — ${meet.lanes} lanes.
      ${std
        ? ' Standard ICF course — automatic heat→semi→final progression applies in full.'
        : ' Non-standard course — heats draw correctly, but ICF Appendix 1 only publishes exact semi/final quotas for 9 lanes, so advance semis/finals manually on the Race Program page.'}
      ${anyRaces ? '' : ` <button onclick="editLanes('${meet.id}', ${meet.lanes})">Change lane count</button>`}
    </div>`;
  } catch (err) {
    el.innerHTML = '';
  }
}

async function editLanes(meetId, currentLanes){
  const val = await laneCountDialog(currentLanes);
  if(val === null) return;
  const res = await fetch(`/api/meets/${meetId}/lanes`, { method:'PATCH', headers:{'Content-Type':'application/json'}, body: JSON.stringify({lanes: val}) });
  const data = await res.json();
  if(!res.ok){ alert(data.error); return; }
  loadVenueInfo();
}

async function init(){
  await initMeetBar('meetBar', {allowCreate:false});
  renderMeetCard('meetCard', {nextLabel:'Go to Race Program',nextHref:'/program.html'});
  renderProgressStrip('progressStrip');
  if(!getMeetId()){ document.getElementById('meetWarning').style.display = 'block'; return; }
  selectedDay = await initDayBar('dayBar');
  await loadEvents();
  await loadVenueInfo();
}
init();
</script>
</body>
</html>
