<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weigh Station — PaddleSport Gauteng</title>
<link rel="stylesheet" href="style.css">
<style>
  #raceList{display:flex;flex-direction:column;gap:12px;}
  .wcard{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;}
  .wcard.finished{border-left:5px solid var(--green);}
  .wcard.running{border-left:5px solid var(--orange);}
  .wcard.pending{border-left:5px solid var(--gray);}
  .wlabel{font-weight:700;font-size:15px;margin-bottom:8px;}
  .wboat{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);}
  .wboat:last-child{border-bottom:none}
  .wboat .num{width:56px;font-weight:700;color:var(--gray);font-family:monospace}
  .wboat .name{flex:1;}
  .wboat .weighed{font-size:12px;font-weight:700;}
  .wboat .weighed.pass{color:var(--green)}
  .wboat .weighed.fail{color:var(--red)}
  .winput{width:72px;padding:6px 8px;font-size:15px;text-align:right}
</style>
</head>
<body>
<header class="topbar">
  <a href="/" class="title"><img src="/psg-logo.jpg" alt="PSG" class="psg-logo"> PaddleSport Gauteng</a>
  <nav><a href="/admin.html">Race Office</a><a href="/race-sort.html">Race Sort</a><a href="/draw.html">Draw</a><a href="/program.html">Race Program</a><a href="/tower.html">Tower</a><a href="/weigh.html">Weigh</a><a href="/results.html">Results</a><a href="/board.html">Board</a><a href="/live.html" id="liveNavLink">Live</a></nav>
  <div id="meetBar"></div>
</header>
<main>
  <h1>Weigh Station</h1>
  <div class="flag" id="meetWarning" style="display:none">No meet selected — pick one at the top-right first.</div>
  <div id="dayBar" style="margin-bottom:12px"></div>
  <p style="color:var(--gray);font-size:14px">Just-finished races are at the top. Tap a boat, enter its weight — no typing needed to find them.</p>
  <input type="text" id="filterBox" placeholder="Filter by event name (optional)…" style="margin-bottom:12px" oninput="render()">
  <div id="raceList">Loading…</div>
</main>
<script src="common.js"></script>
<script>
let allRaces = [];
let openBoat = null; // {raceId, entryId} of the currently-open weigh form
let selectedDay = null;

function fmtMs(ms){
  const cs = Math.floor(ms/10)%100;
  const totalSec = Math.floor(ms/1000);
  const sec = totalSec%60;
  const min = Math.floor(totalSec/60);
  const pad=(n,l=2)=>String(n).padStart(l,'0');
  return `${pad(min)}:${pad(sec)}.${pad(cs)}`;
}
function phaseLabel(r){
  const map = { heat: `Heat ${r.heatNumber}`, semi: `Semi ${r.heatNumber}`, final: 'Final A', finalB: 'Final B', finalC: 'Final C' };
  return map[r.phase] || r.phase;
}

async function loadRaces(){
  const meetId = getMeetId();
  const el = document.getElementById('raceList');
  if(!meetId) return;
  try {
    const dayQS = selectedDay ? `&day=${selectedDay}` : '';
    const races = await (await fetch(`/api/programme/races?meetId=${encodeURIComponent(meetId)}${dayQS}`)).json();
    // Only show finished races — weigh-in happens after locking, not during
    allRaces = races
      .filter(r => r.status === 'finished')
      .sort((a,b) => (b.finishedAt||0) - (a.finishedAt||0) || a.raceNumber - b.raceNumber);
    render();
  } catch (err) {
    console.error(err);
    el.innerHTML = `<div class="flag">Couldn't load races: ${err.message}</div>`;
  }
}

function render(){
  const el = document.getElementById('raceList');
  const q = document.getElementById('filterBox').value.trim().toLowerCase();
  let races = allRaces.filter(r => Object.values(r.laneEntries).some(Boolean) && !r.resultsConfirmed);
  if(q) races = races.filter(r => (r.event && r.event.label || '').toLowerCase().includes(q));
  if(races.length === 0){ el.innerHTML = '<p style="color:var(--gray)">No races awaiting weigh-in — either no races finished yet, or all completed races have their 3 weigh-ins done and results are official.</p>'; return; }

  // The page rebuilds this whole list every 5s (see loadRaces' setInterval)
  // and every time a weight gets logged — remember which kg box had focus
  // so we can hand it straight back afterward, the same fix Tower needed
  // for its slide-number box. Without this, typing a weight mid-refresh
  // silently loses your place.
  const focused = document.activeElement;
  const focusedId = focused && focused.classList && focused.classList.contains('winput') ? focused.id : null;

  el.innerHTML = races.map(race => {
    const rows = Object.entries(race.laneEntries).sort((a,b)=>Number(a[0])-Number(b[0])).map(([num, info]) => {
      if(!info) return '';
      const result = race.results && race.results[info.entryId];
      const isRaceDQ = result && result.status === 'DQ' && result.dqReason && !result.dqReason.toLowerCase().includes('underweight') && !result.dqReason.toLowerCase().includes('kg');
      const isDNF = result && result.status === 'DNF';
      const isDNS = result && result.status === 'DNS';
      const blocked = isRaceDQ || isDNF || isDNS;
      const blockReason = isDNS ? 'DNS' : isDNF ? 'DNF' : `DQ — ${result.dqReason||'race disqualification'}`;
      // Use per-race weigh-in (raceWeighIns) so each race needs fresh weighing
      const weighIn = info.raceWeighIn || info.weighIn; // raceWeighIn set by API per race
      const isOpen = !blocked && ((openBoat && openBoat.raceId === race.id && openBoat.entryId === info.entryId) || !weighIn);
      const badge = weighIn ? (
        !weighIn.checked ? `<span class="weighed" style="color:var(--gray)">${weighIn.weightKg}kg (no minimum on file)</span>`
        : weighIn.passed ? `<span class="weighed pass">✓ ${weighIn.weightKg}kg</span>`
        : `<span class="weighed fail">✗ DQ</span>`
      ) : '';
      const g = info.gender ? (info.gender.toLowerCase().startsWith('f')?'F':info.gender.toLowerCase().startsWith('m')?'M':info.gender) : '';
      const nameCell = info.names.length>1 ? `${info.names[0]}<br>${info.names[1]}` : info.names[0];
      const rightSide = blocked
        ? `<span style="color:var(--gray);font-size:12px;font-style:italic">${blockReason} — weigh-in N/A</span>`
        : isOpen
        ? `<input type="number" step="0.1" class="winput" placeholder="kg" style="width:90px" id="winput-${race.id}-${info.entryId}"
             value="${weighIn ? weighIn.weightKg : ''}"
             onkeydown="if(event.key==='Enter'){submitWeight('${race.id}','${info.entryId}');}">
           <button class="primary" style="font-size:12px;padding:5px 9px" onclick="submitWeight('${race.id}','${info.entryId}')">Log</button>
           ${weighIn ? `<button style="font-size:12px;padding:5px 9px" onclick="toggleBoat('${race.id}','${info.entryId}')">Cancel</button>` : ''}`
        : `${badge} <button style="font-size:12px;padding:5px 9px" onclick="toggleBoat('${race.id}','${info.entryId}')">${weighIn ? 'Edit' : 'Weigh'}</button>`;
      return `<tr style="${blocked?'opacity:0.5':''}">
          <td class="clane">${race.isMassStart?'S':'L'}${num}</td>
          <td class="pname">${nameCell}</td>
          <td class="pmeta cage">${info.ageCategory||''}</td>
          <td class="pmeta cclub">${info.clubCode||''}</td>
          <td class="pmeta csex">${g}</td>
          <td class="pmeta cunion">${info.union||''}</td>
          <td class="pmeta cpsa">${(info.psaIds||[])[0]||''}</td>
          <td style="text-align:right;white-space:nowrap;width:180px">${rightSide}</td>
        </tr>
        <tr><td colspan="8" style="padding:0"><div id="wresult-${race.id}-${info.entryId}"></div></td></tr>`;
    }).join('');

    const weighedCount = Object.values(race.laneEntries||{}).filter(info => info && (info.raceWeighIn||info.weighIn)).length;
    const required = Math.min(3, Object.values(race.laneEntries||{}).filter(i=>i).length);
    const canLock = weighedCount >= required;
    return `<div class="wcard ${race.status}">
      <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:8px">
        <div class="wlabel" style="margin:0">R${race.raceNumber} — ${race.event ? race.event.label : ''} — ${phaseLabel(race)}${race.isMassStart?` (mass start)`:''}</div>
        <div style="display:flex;align-items:center;gap:10px">
          <span style="font-size:13px;color:${canLock?'var(--green)':'var(--gray)'}">
            ${weighedCount}/${required} weighed${canLock?' ✓':''}
          </span>
          <button onclick="lockRaceWeigh('${race.id}')" ${canLock?'':'disabled'}
            style="padding:8px 16px;background:${canLock?'var(--orange)':'#ccc'};color:#fff;border:none;border-radius:8px;font-weight:700;font-size:13px;cursor:${canLock?'pointer':'not-allowed'}">
            🔒 Lock & confirm
          </button>
        </div>
      </div>
      <div class="table-scroll"><table class="review-table">
        <tr><th>LANE</th><th>NAME</th><th>AGE</th><th>CLUB</th><th>M/F</th><th>UNION</th><th>PSA #</th><th style="text-align:right;width:180px">WEIGHT</th></tr>
        ${rows}
      </table></div>
    </div>`;
  }).join('');

  if(focusedId){
    const el2 = document.getElementById(focusedId);
    if(el2) el2.focus();
  }
}

function toggleBoat(raceId, entryId){
  if(openBoat && openBoat.raceId === raceId && openBoat.entryId === entryId){
    openBoat = null;
  } else {
    openBoat = { raceId, entryId };
  }
  render();
  const input = document.getElementById(`winput-${raceId}-${entryId}`);
  if(input) input.focus();
}

async function lockRaceWeigh(raceId){
  if(!confirm('Lock and confirm results for this race? It will disappear from the weigh station.')) return;
  const res = await fetch(`/api/races/${raceId}/confirm-results`, {method:'POST'});
  if(!res.ok){ const d=await res.json(); alert(d.error); return; }
  await loadRaces();
}

async function submitWeight(raceId, entryId){
  const input = document.getElementById(`winput-${raceId}-${entryId}`);
  const weightKg = parseFloat(input.value);
  if(isNaN(weightKg)){ alert('Enter a weight'); return; }
  try {
    const res = await fetch(`/api/races/entries/${entryId}/weigh`, {
      method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({weightKg})
    });
    const data = await res.json();
    const resultEl = document.getElementById(`wresult-${raceId}-${entryId}`);
    if(!res.ok){ resultEl.innerHTML = `<div class="flag">${data.error}</div>`; return; }
    const w = data.weighIn;
    if(!w.checked){
      resultEl.innerHTML = `<div class="flag">${w.note}</div>`;
    } else if(w.passed){
      resultEl.innerHTML = `<div class="flag" style="background:#E4F5EC;border-color:#9ED8B8;color:#1E8E5A">Passed — ${weightKg}kg ≥ ${w.minRequiredKg}kg minimum.</div>`;
    } else {
      resultEl.innerHTML = `<div class="flag" style="background:#FBE7E7;border-color:#EBAFAF;color:#C93B3B"><b>DQ — ${w.dqReason}</b></div>`;
    }
    openBoat = null;
    await loadRaces();
  } catch (err) {
    console.error(err);
    alert(`Couldn't log weight: ${err.message}`);
  }
}

async function init(){
  await initMeetBar('meetBar', {allowCreate:false});
  if(!getMeetId()){ document.getElementById('meetWarning').style.display = 'block'; return; }
  selectedDay = await initDayBar('dayBar');
  await loadRaces();
  setInterval(loadRaces, 5000);
}
init();
</script>
</body>
</html>
